[package]
name = "libqhyccd-sys"
version = "0.1.4"
edition = "2021"
authors = ["Igor von Nyssen <igor@vonnyssen.com>"]
links = "qhyccd"
repository = "https://github.com/ivonnyssen/qhyccd-rs"
license = "MIT OR Apache-2.0"
description = "Rust bindings for QHY CCD SDK"
# Explicit, lower-than-workspace MSRV (dual-homed to crates.io, ADR-009): a
# dependency-free, hand-written FFI shim, so its floor is just what the bindings
# compile on — 1.68.0. The wrapper (qhyccd-rs) sits higher at 1.85.0 since #392
# put it on rand 0.10 / derive_more 2.1; this shim has no such deps, so it keeps
# the lower floor independently. Verified out-of-tree by the nightly
# publish-readiness check (docs/plans/archive/publish-readiness-checks.md), not
# in-workspace. See ../Cargo.toml.
rust-version = "1.68.0"
exclude = ["qhyccd-sdk/*"]

[lib]
name = "libqhyccd_sys"
path = "lib.rs"

[dependencies]

[features]
# Removed vendored feature - now uses system-installed SDK

# The workspace lint policy, as a concrete copy rather than `workspace = true`:
# this crate is dual-homed to crates.io, and the nightly publish-readiness
# check builds it copied out of the workspace
# (scripts/verify-publishable-crate.sh), where inheritance has nothing to
# resolve against. The table must stay a verbatim mirror of [workspace.lints.*]
# in the root Cargo.toml (which also carries the policy's rationale) —
# tools/ci/check_lints_parity.py fails the `stable / clippy` gate on any
# drift, so edit the root table and mirror it here in the same change. The
# published copy is inert for consumers: registry dependencies build under
# `--cap-lints allow`.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
unreachable = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
panic_in_result_fn = "deny"
unchecked_time_subtraction = "deny"
string_slice = "deny"
as_conversions = "deny"
arithmetic_side_effects = "deny"
indexing_slicing = "deny"
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
