[package]
name = "rusty-photon-driver"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Shared ASCOM-driver runtime layer for rusty-photon: the common DriverError model, its ASCOM error-code mapping, and the glue to the drivers' setup pages"

[features]
default = []
# Device claims (docs/plans/device-claims-and-phd2-camera.md, Part A): the
# placeholder Camera that holds a listed device number whose camera cannot be
# served, the failed USB scan's background re-scan, and the camera drivers'
# own part of their setup pages (the Cameras section and each camera's page,
# docs/plans/driver-setup-pages.md D11). Only the camera drivers with a
# `usb_devices` list turn it on, so no other driver's graph gains
# ascom-alpaca's `Camera` trait through this crate.
claims = [
    "ascom-alpaca/camera",
    "dep:async-trait",
    "dep:tokio-util",
    "dep:rusty-photon-service-lifecycle",
]

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true, optional = true }
# `rt` for `task::AbortOnDropHandle`, which ends the re-scan with the server it
# belongs to.
tokio-util = { workspace = true, features = ["rt"], optional = true }
# The markup of a driver's own part of its pages (the `overrides` module, the
# camera pages), as `rusty-photon-setup` draws its own.
maud = { workspace = true }
# Only the core ASCOM error types (`ASCOMError`/`ASCOMResult`/`ASCOMErrorCode`,
# unfeatured in `errors.rs`) are used. lib.rs `compile_error!`s unless one device
# and one network feature are on. The device guard keys off the empty `__anydevice`
# marker, so we satisfy it without enabling any real device trait — no
# cover_calibrator leaking into every driver's graph via feature unification. The
# network side needs a *real* feature though: the always-built `api::device_state`
# module's serde derives are gated on `client`/`server`, not on `__anynetwork`, so
# the marker alone won't compile. `server` is the lightest sufficient choice and is
# already enabled by every driver, so it adds nothing to any driver's build graph.
ascom-alpaca = { workspace = true, features = ["__anydevice", "server"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
rusty-photon-config = { workspace = true }
# The reload signal the claims' serve loop rebuilds the server on (the
# `claims` feature).
rusty-photon-service-lifecycle = { workspace = true, optional = true }
rusty-photon-setup = { workspace = true }
# The header vocabulary the setup glue reads (`Content-Type`); the same
# crate the pinned ascom-alpaca speaks.
http = { workspace = true }
rusty-photon-shared-transport = { workspace = true }

[dev-dependencies]
serde = { workspace = true }
schemars = { workspace = true }
tempfile = { workspace = true }
# test-util: unlocks paused tokio time (`start_paused`), which the re-scan's
# schedule tests run on.
tokio = { workspace = true, features = ["test-util"] }
