[package]
name = "rusty-photon-driver"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Shared ASCOM-driver runtime layer for rusty-photon: the common DriverError model, its ASCOM error-code mapping, and the glue to the drivers' setup pages"

[features]
default = []
# Device claims: the placeholder Camera that holds a listed device number whose
# camera cannot be served, the failed USB scan's background re-scan, and the
# camera drivers' own part of their setup pages (the Cameras section and each
# camera's page). Only the camera drivers with a `usb_devices` list turn it on,
# so no other driver's graph gains ascom-alpaca's `Camera` trait through this
# crate.
claims = [
    "ascom-alpaca/camera",
    "dep:async-trait",
    "dep:tokio-util",
]

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true, optional = true }
# `rt` for `task::AbortOnDropHandle`, which ends the re-scan with the server it
# belongs to.
tokio-util = { workspace = true, features = ["rt"], optional = true }
# The markup of a driver's own part of its pages (the `overrides` module, the
# camera pages), as `rusty-photon-setup` draws its own.
maud = { workspace = true }
# `server` for the setup hooks (`ServerSetup`, `SetupRequest`, `SetupResponse`)
# and the discovery responder (`discovery::DiscoveryServer`). ascom-alpaca's
# lib.rs `compile_error!`s unless a device feature is on too, and outside
# `claims` this crate implements no device trait: the empty `__anydevice` marker
# satisfies that guard without enabling a real one — no cover_calibrator leaking
# into every driver's graph via feature unification.
ascom-alpaca = { workspace = true, features = ["__anydevice", "server"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
rusty-photon-config = { workspace = true }
# The restart handle the `restart` routes request through, and the reload
# signal the claims' serve loop rebuilds the server on.
rusty-photon-service-lifecycle = { workspace = true }
# The `restart` routes every driver merges into its router.
axum = { workspace = true }
serde = { workspace = true }
rusty-photon-setup = { workspace = true }
# The header vocabulary the setup glue reads (`Content-Type`); the same
# crate the pinned ascom-alpaca speaks.
http = { workspace = true }
rusty-photon-shared-transport = { workspace = true }

[dev-dependencies]
schemars = { workspace = true }
tempfile = { workspace = true }
# test-util: unlocks paused tokio time (`start_paused`), which the re-scan's
# schedule tests run on.
tokio = { workspace = true, features = ["test-util"] }
# `ServiceExt::oneshot`, which drives the `restart` routes in process.
tower = { workspace = true, features = ["util"] }
# The token a test's `Restart` cancels.
tokio-util = { workspace = true }
