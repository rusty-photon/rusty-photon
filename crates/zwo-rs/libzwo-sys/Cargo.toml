[package]
name = "libzwo-sys"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
authors = ["Igor von Nyssen <igor@vonnyssen.com>"]
license = "MIT OR Apache-2.0"
# Canonical development home is the rusty-photon monorepo (ADR-010); still
# published to crates.io from crates/zwo-rs/libzwo-sys (dual-home).
repository = "https://github.com/rusty-photon/rusty-photon"
description = "Raw FFI bindings (bindgen) for the ZWO ASI / EFW / EAF SDK"
keywords = ["zwo", "asi", "efw", "ffi", "astronomy"]
categories = ["external-ffi-bindings", "hardware-support"]
# `links` is a uniqueness marker for the native ZWO SDK libraries this crate
# links (libASICamera2 / libEFWFilter / libEAFFocuser, per feature). Requires
# build.rs.
links = "zwo"
# Vendored MIT ZWO SDK headers live under sdk/include/ (ZWO's own MIT notice is
# in sdk/include/license.txt). bindgen reads them at build time. The SDK *binary*
# is NOT vendored — it must be installed on the system (see the workspace README).

[features]
# The three ZWO device SDKs are independent libraries with no shared handle, so
# each link directive is gated by its own feature (ADR-014): a consumer links
# only the SDK(s) it talks to. The features are purely ADDITIVE link surface —
# `--all-features` yields the full link, i.e. exactly the pre-split behaviour —
# so they don't reintroduce the silent-simulation footgun that keeps
# ZWO_SKIP_NATIVE_LINK env-gated (see build.rs). Bindings are always generated
# for the whole vendored header set; bare extern declarations force no linkage.
# Default = everything, so a bare/external `cargo build` behaves exactly like
# the pre-split crate; rusty-photon's services narrow via
# `default-features = false`.
default = ["camera", "efw", "focuser"]
# Link libASICamera2 (ASI cameras; pulls libusb-1.0).
camera = []
# Link libEFWFilter (EFW filter wheels).
efw = []
# Link libEAFFocuser (EAF focusers).
focuser = []

[dependencies]

[build-dependencies]
# `default-features = false` drops bindgen's `prettyplease` default feature and
# keeps the other two defaults (`logging`, and `runtime` — the latter is what
# makes clang-sys load libclang dynamically). build.rs never calls
# `.formatter()`, so the bindings are emitted through bindgen's default
# `Formatter::Rustfmt` and the prettyplease path is dead weight. It is also a
# standing hazard: bindgen declares `prettyplease = ">=0.2.7, <0.4"` and
# `syn = ">=2, <4"` as two independently resolved ranges, so any dependency
# that drags prettyplease down to 0.2 while syn resolves to 3 produces a
# combination bindgen cannot compile, because its
# `prettyplease::unparse(&syn::parse_quote!(..))` needs both crates on the same
# syn major. Nothing in the graph pins prettyplease today, but keeping the
# feature off means a future dependency cannot reintroduce that break here.
bindgen = { version = "0.73", default-features = false, features = [
  "logging",
  "runtime",
] }

[lints]
workspace = true
