# Cargo settings for the whole workspace. The Bazel build does not read this
# file — its equivalents live in `.bazelrc` and in the `crate.annotation` calls
# in `MODULE.bazel`.

[env]
# Force aws-lc-sys to build its vendored AWS-LC from source. Left unset, the
# build script probes OPENSSL_DIR / OPENSSL_INCLUDE_DIR / OPENSSL_LIB_DIR and
# then pkg-config for a system AWS-LC, and links it dynamically if it finds
# one. `cargo ci build-packages` builds the shipped binaries with plain
# `cargo build --release`, so on a build host that happens to carry AWS-LC the
# resulting .deb/.rpm would need a libcrypto at runtime that the target — the
# Pi 5 field rig — does not have. `force` is left false so an operator can
# still override by exporting the variable.
AWS_LC_SYS_USE_SYSTEM = "0"

[alias]
# The workspace's developer tools (tools/rusty-photon-ci, ADR-022): `cargo ci
# <tool>`, for example `cargo ci repin-bazel-lock`; `cargo ci help` lists them.
ci = "run --package rusty-photon-ci --"
