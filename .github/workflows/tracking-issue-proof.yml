# TEMPORARY: the live proof of the tracking-issue action (plan item J7).
# Deleted before the PR merges. A workflow only on a branch cannot be
# dispatched, so it runs on a push to the PR's branch: it creates a
# throwaway label, the action opens an issue with it and then comments on
# that issue, and the last step closes the issue and deletes the label.
name: tracking-issue proof (temporary)
on:
  push:
    branches: [ci/j7-nightly-tracking-issue]
permissions: {}
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      TITLE: "J7 proof: throwaway tracking issue (run ${{ github.run_id }}-${{ github.run_attempt }})"
      LABEL: j7-proof-throwaway
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/actions/tracking-issue
            .github/actions/lib
      # GitHub drops a label that does not exist from a new issue.
      - name: Create the throwaway label
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh label create -R "$GITHUB_REPOSITORY" "$LABEL" --description "J7 proof run; deleted by the same run"
      - name: First failure opens the issue
        id: first
        uses: ./.github/actions/tracking-issue
        with:
          title: ${{ env.TITLE }}
          label: ${{ env.LABEL }}
          body: |
            A throwaway issue from the tracking-issue action's live proof.
            The same run closes it.
      - name: Second failure comments on it
        id: second
        uses: ./.github/actions/tracking-issue
        with:
          title: ${{ env.TITLE }}
          label: ${{ env.LABEL }}
          body: Not used, as the issue is open.
      - name: Check the issue
        env:
          GH_TOKEN: ${{ github.token }}
          FIRST: ${{ steps.first.outputs.number }}
          SECOND: ${{ steps.second.outputs.number }}
        run: |
          set -euo pipefail
          test "$FIRST" = "$SECOND"
          gh api "repos/$GITHUB_REPOSITORY/issues/$FIRST" > issue.json
          jq -e --arg t "$TITLE" '.title == $t' issue.json
          jq -e --arg l "$LABEL" '[.labels[].name] | sort == ([$l, "ci-flake"] | sort)' issue.json
          jq -e --arg r "Run: $RUN_URL" '.body | contains($r)' issue.json
          jq -r .body issue.json
          gh api "repos/$GITHUB_REPOSITORY/issues/$FIRST/comments" --jq '.[].body' > comments.txt
          cat comments.txt
          test "$(cat comments.txt)" = "Failed again — run: $RUN_URL"
      - name: Close the issue and delete the label
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          FIRST: ${{ steps.first.outputs.number }}
          SECOND: ${{ steps.second.outputs.number }}
        run: |
          labelled=$(gh issue list -R "$GITHUB_REPOSITORY" --label "$LABEL" --state open --json number --jq '.[].number')
          # Unquoted on purpose: an empty number drops out, a list splits.
          # shellcheck disable=SC2086
          for n in $(printf '%s\n' $FIRST $SECOND $labelled | sort -u); do
            gh issue close -R "$GITHUB_REPOSITORY" "$n" --reason "not planned" --comment "Closed by the tracking-issue proof run."
          done
          gh label delete -R "$GITHUB_REPOSITORY" "$LABEL" --yes
