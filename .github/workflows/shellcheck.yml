# shellcheck over the runner pool's host shell in tools/ci: the orchestrator,
# the EDAC check, their test harnesses and the runner-guest scripts.
#
# Cadence: paths-filtered push to main + pull_request, and workflow_dispatch
# (manual). It lints only these files, and they change rarely, so it runs only
# when one of them changes, or this workflow, or the action that holds the
# job's pin and logic, or the helpers it imports. ADR-022 leaves this shell in
# bash, so the job keeps the same work after the CI shell plan.
#
# Not a required check, and it cannot be one while it is path-filtered: a
# workflow the filter skips leaves its check pending, and a required check
# would block every pull request that does not touch these files.
#
# The first two paths below are the files the action lints (its `scripts`).
# Widening what it lints means widening them too, or a change to a new file
# runs nothing.
permissions:
  contents: read
on:
  push:
    branches: [main]
    paths:
      - "tools/ci/**/*.sh"
      - "tools/ci/runner-guest/rp-set-hostname"
      - ".github/workflows/shellcheck.yml"
      - ".github/actions/shellcheck/**"
      - ".github/actions/lib/**"
  pull_request:
    paths:
      - "tools/ci/**/*.sh"
      - "tools/ci/runner-guest/rp-set-hostname"
      - ".github/workflows/shellcheck.yml"
      - ".github/actions/shellcheck/**"
      - ".github/actions/lib/**"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
name: shellcheck
jobs:
  shellcheck:
    # No other check lints shell. The runner-pool orchestrator is ~1900 lines
    # of bash that deletes storage on a CI host, and several of its worst
    # defects were shell-specific footguns of exactly the kind shellcheck
    # names — a pipeline status read through `!`, an assignment in a `local`
    # reading an outer variable of the same name. Those were caught by running
    # shellcheck locally, by hand, which is not a gate.
    #
    # Scoped to tools/ci for now rather than the whole tree: that is the shell
    # that runs with root on the hypervisor, and a clean baseline there is
    # worth more than a partial sweep everywhere. Widening it is a follow-up,
    # not a reason to delay this.
    runs-on: ubuntu-latest
    name: stable / shellcheck
    steps:
      - uses: actions/checkout@v7
      # shellcheck at the release the action pins (shellcheck.mjs says why it
      # is pinned), checked against its SHA-256 and the version it reports,
      # and run by its path, so no other shellcheck on the PATH can lint in
      # its place. The logic is the action's (docs/skills/ci-logic.md).
      - name: shellcheck tools/ci
        uses: ./.github/actions/shellcheck
