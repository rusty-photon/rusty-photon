# Self-healing supply-chain refresh for ASTAP CLI SHA pins.
#
# Triggers when the nightly `install-astap` smoke fails (the canonical
# signal that upstream rotated a SourceForge archive without us
# refreshing the pin) or on manual dispatch. For each platform in
# install-astap's table (`.github/actions/install-astap/assets.json`),
# `detect` downloads the upstream archive and compares its SHA-256 with
# the pin, and, for a rotated platform with a runner of its own,
# verifies the new binary by solving the committed M101 fixture
# (`services/plate-solver/tests/fixtures/m101_known.fits`) to the known
# center (RA 210.8099°, Dec 54.3469°) within the same 0.01° tolerance
# the BDD scenario uses.
#
# `open-pr` then opens (or updates) an auto-PR with the new pins IFF
# every verified platform passed. If verification fails on any
# platform, it files a separate tracking issue instead — that case
# means upstream shipped something broken, and a human needs to look.
# The M101 verification is the only ASTAP validation that runs before
# merge — `pull_request`-triggered workflows (`install-astap`,
# `plate-solver-smoke`) do NOT fire on the auto-PR because GitHub
# Actions suppresses workflows triggered by GITHUB_TOKEN-authored
# events. A maintainer can close/reopen the auto-PR to wake a redundant
# PR-CI signal if desired
# (https://docs.github.com/en/actions/security-guides/automatic-token-authentication#using-the-github_token-in-a-workflow).
#
# Windows-ARM64 has no GitHub-hosted runner, so its SHA is refreshed
# cross-mirror with no verification — same posture ADR-005 already
# documents for that row.
#
# The logic is the refresh-astap action's (`.github/actions/refresh-astap`,
# plan item J8 in docs/plans/archive/ci-shell-to-code.md). See
# `docs/decisions/005-plate-solver.md` §"Pinned SHA-256 + refresh
# procedure" for the manual procedure this workflow automates.

name: refresh-astap-shas

on:
  workflow_run:
    workflows: ["install-astap"]
    types: [completed]
    # install-astap fires on pull_request too (per its paths filter on
    # the action itself). Without a branches filter, this workflow —
    # which holds write tokens — would react to those PR runs and
    # could be tricked into opening auto-PRs from untrusted code.
    # Restricting to main means only scheduled/push-to-main runs of
    # install-astap propagate here.
    branches: [main]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Read what open-pr would act on and print what it would write, writing nothing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  detect:
    # Run on manual dispatch OR when install-astap concluded as failure.
    # Skipped on install-astap successes (no rotation suspected).
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure'
    name: detect / ${{ matrix.runner }}
    runs-on: ${{ matrix.os }}
    # Read only: a rotated archive's binary runs here before anyone has
    # looked at it.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    runner: Linux-X64,     verify: true }
          - { os: ubuntu-24.04-arm, runner: Linux-ARM64,   verify: true }
          - { os: macos-latest,     runner: macOS-ARM64,   verify: true }
          - { os: windows-latest,   runner: Windows-X64,   verify: true }
          # No hosted Windows-ARM64 runner: compared from Linux, unverified.
          - { os: ubuntu-latest,    runner: Windows-ARM64, verify: false }
    steps:
      - uses: actions/checkout@v7
        with:
          # workflow_run defaults to the trigger workflow's head_sha
          # (could be a PR commit if install-astap was failing on a PR).
          # Check out main so the comparison reads the same table the
          # auto-PR will eventually update.
          ref: main
          persist-credentials: false
          sparse-checkout: |
            .github/actions/install-astap
            .github/actions/lib
            .github/actions/refresh-astap
            services/plate-solver/tests/fixtures

      - name: Compare upstream with the pin, and verify a rotated archive
        id: detect
        uses: ./.github/actions/refresh-astap/detect
        with:
          runner: ${{ matrix.runner }}
          verify: ${{ matrix.verify }}

      - uses: actions/upload-artifact@v7
        if: steps.detect.outputs.rotated == 'true'
        with:
          name: refresh-result-${{ matrix.runner }}
          path: refresh-result/

  open-pr:
    needs: detect
    # Default success() gate is implicit — open-pr runs only when every
    # detect leg succeeded. A detect-leg infra failure (download, unzip,
    # a binary that will not start) skips this job; the next
    # install-astap nightly will retrigger refresh. An M101 verification
    # failure does NOT fail the leg — it surfaces in the leg's result,
    # and open-pr files the blocker issue for it.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      # The action and the modules it imports. It reads main's table and
      # commits through the API, so nothing is pushed from here.
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: |
            .github/actions/install-astap
            .github/actions/lib
            .github/actions/refresh-astap
            .github/actions/tracking-issue

      - uses: actions/download-artifact@v8
        with:
          path: artifacts/
          pattern: refresh-result-*
          merge-multiple: false

      - name: Open or update the auto-PR, or file the blocker issue
        uses: ./.github/actions/refresh-astap/publish
        with:
          results: artifacts
          dry-run: ${{ inputs.dry-run == true }}
