# Nightly cross-platform real-ASTAP smoke for plate-solver.
#
# Drives the wrapper end-to-end against a real ASTAP install on each
# target OS. The wrapper's contract correctness is already covered on
# every PR by the mock_astap-backed BDD suite; this workflow's job is
# to catch *integration drift* — a real ASTAP that has rotated its
# `.wcs` shape, CLI surface, or banner format would silently bypass
# the mock-based BDD but trip a `@requires-astap`-tagged scenario
# here.
#
# Cadence: nightly cron, a push that touches the service, this workflow
# or the actions it uses, and workflow_dispatch. Not on every PR (PRs
# already pay for the mock BDD; ASTAP install + DB download would be
# ~400 MB per run × 3 OSes per PR for marginal benefit).
#
# docs/services/plate-solver.md § Real-ASTAP Coverage Cadence holds the
# fixture, the timings and their guard.

name: plate-solver-smoke

permissions:
  contents: read

on:
  schedule:
    # Every day at 03:30 UTC, an hour before install-astap's nightly
    # run, so the two don't fight for the same upstream SourceForge
    # endpoint at the same minute.
    - cron: "30 3 * * *"
  workflow_dispatch:
  # The only workflow that installs the D20 database, so a change to the
  # shared modules install-astap runs (.github/actions/lib) runs it too.
  push:
    paths:
      - "services/plate-solver/**"
      - ".github/actions/install-astap/**"
      - ".github/actions/lib/**"
      - ".github/actions/plate-solver-times/**"
      - ".github/workflows/plate-solver-smoke.yml"

# A newer push to a ref cancels that ref's older push run. The event name
# keeps a push to main from cancelling the scheduled run, which alone opens
# or updates the tracking issue.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: smoke / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # `stagger` offsets each leg's D20 download when the cache is cold.
        # The repo Actions cache sits at its 10 GB ceiling, so the 400 MB D20
        # entry is evicted regularly and a cold nightly has all three legs
        # pulling the same ~400 MB from the same upstream in the same second.
        # A healthy fetch takes about 20 s, so 45 s spacing keeps the legs
        # from overlapping. The wait is skipped entirely on a cache hit,
        # so a warm run pays nothing.
        include:
          - os: ubuntu-latest
            stagger: 0
          - os: macos-latest
            stagger: 45
          - os: windows-latest
            stagger: 90
    steps:
      - uses: actions/checkout@v7
        id: checkout

      - uses: dtolnay/rust-toolchain@stable

      - name: Install ASTAP + D20 database
        uses: ./.github/actions/install-astap
        with:
          download-database: "true"
          download-stagger-seconds: ${{ matrix.stagger }}

      # The mac binary is ad-hoc-signed by the upstream maintainer.
      # First-run quarantine flagging would block exec without
      # surfacing a useful error. The service README tells an operator
      # to clear it by hand on first run, and every CI run is a first run.
      - name: macOS — clear quarantine on astap_cli
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          xattr -d com.apple.quarantine "$ASTAP_BINARY" 2>/dev/null || true

      - name: Pre-build wrapper + mock_astap (BDD discovery)
        shell: bash
        run: |
          cargo build -p plate-solver --all-features --tests

      - name: Run @requires-astap BDD scenarios
        id: bdd
        shell: bash
        env:
          # ASTAP_BINARY and ASTAP_DB_DIR are set by install-astap.
          # ASTAP_BINARY flips the bdd.rs filter to fire the
          # @requires-astap scenarios, which read both.
          RUST_LOG: plate_solver=debug
          # The "I record the solve duration as ..." BDD step appends a
          # `label,elapsed_ms` row to this file.
          PLATE_SOLVER_PERF_CSV: ${{ runner.temp }}/plate-solver-perf.csv
        run: |
          set -euo pipefail
          cargo test -p plate-solver --all-features --test bdd

      # The times go in the log however the BDD run ended, so a failure can
      # be read from the run's page without the artifact below; the budget
      # (times.mjs) is checked only after a BDD run that passed. The action
      # is read from the checkout, so it needs one.
      - name: Log and check solve times
        if: always() && steps.checkout.outcome == 'success'
        uses: ./.github/actions/plate-solver-times
        with:
          csv: ${{ runner.temp }}/plate-solver-perf.csv
          os: ${{ matrix.os }}
          check: ${{ steps.bdd.outcome == 'success' }}

      - name: Upload timing CSV artifact
        # Per-OS artifact, so a run leaves one CSV per OS to download.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plate-solver-perf-${{ matrix.os }}
          path: ${{ runner.temp }}/plate-solver-perf.csv
          if-no-files-found: warn
          retention-days: 90

  notify-on-failure:
    # Open or update a tracking issue when the nightly run fails so
    # divergence is visible without depending on someone reading
    # scheduled-workflow logs. Skipped on push and workflow_dispatch
    # so manual debugging runs don't churn an issue.
    needs: smoke
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      # The action and the helpers it imports, nothing else.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/actions/tracking-issue
            .github/actions/lib
      - name: Open or update tracking issue
        uses: ./.github/actions/tracking-issue
        with:
          title: "nightly: plate-solver real-ASTAP smoke failing"
          label: plate-solver-nightly
          body: |
            The nightly cross-platform real-ASTAP smoke workflow failed.

            Likely causes, by the step that failed in the linked run:

            - "Install ASTAP + D20 database", with
              `d20_star_database.zip: SHA-256 mismatch` in its log: upstream
              rotated the D20 star database. Nothing else reports that and
              nothing refreshes its pin, which moves by hand: see
              docs/services/plate-solver.md § "Refreshing the ASTAP pins".
              A mismatch on an ASTAP CLI archive instead is the
              `install-astap-nightly` issue's, and the refresh it starts.
            - "Run @requires-astap BDD scenarios": the real ASTAP no longer
              behaves as the wrapper and its mock expect (its `.wcs` shape,
              command line or banner).
            - "Log and check solve times": the M 101 solves broke the time
              budget, whose error annotations say which: a blind solve
              under 10× the hinted one, or a solve over its ceiling. See
              docs/services/plate-solver.md § "Real-ASTAP Coverage Cadence".
