# This workflow runs checks for unsafe code. Runs:
# - address sanitizer - detects memory errors
# - leak sanitizer - detects memory leaks
# Note: miri has been moved to the scheduled (rolling) workflow to avoid slow CI on every push
#
# Sanitizers run nightly + on push to main (not on PRs). The project uses
# minimal unsafe code, so nightly coverage is sufficient to catch regressions
# before they reach a release.
permissions:
  contents: read
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
name: safety
jobs:
  sanitizers:
    runs-on: ubuntu-latest
    # Explicit timeout — see test.yml's plan job. The sanitizer `cargo test`
    # step runs the same BDD scenarios that intermittently hang; without a
    # cap GitHub's 360 min default let `ubuntu / nightly / address` burn a
    # full 6 h. The suite's healthy runtime has crept up (address was
    # already timing out at 40 min by 2026-07-20, leak within ~1-2 min of
    # the cap by 2026-07-22), so 40 min started clipping healthy runs;
    # 80 min restores headroom without reopening the 6 h risk.
    timeout-minutes: 80
    name: ubuntu / nightly / ${{ matrix.sanitizer }}
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, leak]
    env:
      CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu
      # Build the zwo + qhy + svbony crates' pure-Rust `simulation` path with
      # no native SDK link, so they can be sanitized without provisioning any
      # SDK (see the cargo build step +
      # crates/{zwo-rs/libzwo-sys,qhyccd-rs/libqhyccd-sys,svbony-rs/libsvbony-sys}/build.rs).
      ZWO_SKIP_NATIVE_LINK: "1"
      QHYCCD_SKIP_NATIVE_LINK: "1"
      SVBONY_SKIP_NATIVE_LINK: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Install ASCOM OmniSim
        uses: ./.github/actions/install-omnisim
      - name: Install Pebble
        uses: ./.github/actions/install-pebble
      - name: Install nightly
        uses: dtolnay/rust-toolchain@nightly
      - run: sudo apt install -y llvm
        name: Install llvm (symbolizer for debug symbols)
      - name: Enable opt-level 1 for sanitizers
        run: |
          # https://github.com/japaric/rust-san#unrealiable-leaksanitizer
          if ! grep -qE '^\s*\[profile.dev\]' Cargo.toml; then
              echo >> Cargo.toml
              echo '[profile.dev]' >> Cargo.toml
          fi
          sed -i '/^\s*\[profile.dev\]/,/^\s*\[/ {/^\s*opt-level/d}' Cargo.toml
          sed -i '/^\s*\[profile.dev\]/a opt-level = 1' Cargo.toml
      - name: cargo build
        # All three native-SDK camera stacks (zwo-rs/libzwo-sys,
        # qhyccd-rs/libqhyccd-sys, svbony-rs/libsvbony-sys) build their
        # pure-Rust `simulation` path with the real FFI `cfg`'d out and the
        # *_SKIP_NATIVE_LINK envs (above) omitting the link directives, so the
        # whole workspace builds with no SDK to provision and every crate —
        # including qhy-camera, zwo-camera, and svbony-camera — is sanitized.
        # (The real unsafe FFI is inherently un-sanitizable, but it is not
        # compiled here, so nothing is lost.)
        run: cargo build --workspace --all-features --all-targets
        env:
          RUSTFLAGS: "-Z sanitizer=${{ matrix.sanitizer }}"
      - name: cargo test
        # only --lib --tests for asan b/c of https://github.com/rust-lang/rust/issues/53945
        # exclude bdd-infra: its unit tests look for binaries in target/debug/
        # which doesn't exist when CARGO_BUILD_TARGET is set.
        # qhy-camera is NOT excluded: QHYCCD_SKIP_NATIVE_LINK=1 (above) builds its
        # pure-Rust simulation path SDK-free, so it sanitizes like zwo-camera.
        # --no-fail-fast: one crate's sanitizer report must not hide the rest of
        # the workspace. Without it cargo stops at the first failing test binary,
        # so a run reports whichever crate happens to fail earliest and says
        # nothing about the crates whose binaries never got to run.
        run: |
          if [ "${{ matrix.sanitizer }}" = "address" ]; then
            cargo test --workspace --exclude bdd-infra --lib --tests --all-features --no-fail-fast
          else
            cargo test --workspace --exclude bdd-infra --all-features --all-targets --no-fail-fast
          fi
        env:
          ASAN_OPTIONS: "detect_odr_violation=0:detect_leaks=0"
          RUSTFLAGS: "-Z sanitizer=${{ matrix.sanitizer }}"

  notify-on-failure:
    # Open or update a tracking issue when the nightly sanitizer run fails so
    # ASan/LSan findings surface without depending on someone reading
    # scheduled-workflow logs. Skipped on push, pull_request, and
    # workflow_dispatch so manual debugging runs don't churn an issue.
    #
    # cancelled() alongside failure(): a job killed by timeout-minutes reports
    # conclusion "cancelled", not "failure" — failure() alone silently misses
    # it. Safe to OR in here: this workflow only triggers on push/schedule/
    # workflow_dispatch (github.head_ref is always empty for those), so the
    # concurrency group above always falls back to the per-run github.run_id
    # and can never cancel one of this workflow's own runs via supersession —
    # every "cancelled" conclusion this can see is a genuine timeout (or a
    # human explicitly cancelling, which is worth surfacing too).
    needs: sanitizers
    if: (failure() || cancelled()) && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      # The action and the helpers it imports, nothing else.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/actions/tracking-issue
            .github/actions/lib
      - name: Open or update tracking issue
        uses: ./.github/actions/tracking-issue
        with:
          title: "nightly: safety sanitizers failing"
          label: safety-nightly
          body: |
            The nightly safety workflow failed on at least one sanitizer.

            Likely causes: AddressSanitizer detected a memory error (use-after-free,
            buffer overflow, etc.) or LeakSanitizer detected a memory leak in newly
            added or recently changed unsafe code. Inspect the failed job in the
            linked run for the sanitizer report.
