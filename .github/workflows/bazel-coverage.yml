# Bazel-based code coverage — the per-PR coverage gate.
#
# This is a required check and it feeds Coveralls, the sole coverage vendor:
# the README badge, the PR coverage comment, and (once enabled in the
# Coveralls repo settings) the coverage status checks all come from the
# combined report uploaded here. It is the SOLE coverage source; the Cargo
# nightly (test.yml) only builds + tests.
#
# Why a separate workflow (not a job in bazel.yml): coverage needs a different
# toolchain (nightly) and a fully instrumented build graph -- a separate action
# namespace from bazel.yml's stable build/test. Keeping it separate means its
# (slower, nightly, instrumented) actions and its cache never perturb the
# build/test job.
#
# Properties:
#  * nightly toolchain + --cfg=coverage_nightly (see .bazelrc --config=coverage)
#    so #[cfg_attr(coverage_nightly, coverage(off))] on every `#[cfg(test)] mod
#    tests` block takes effect and test code stays out of the numbers.
#  * LLVM source-based instrumentation, first-party crates only.
#  * Runs `bazel coverage //...` over the WHOLE repo every time. Untouched
#    targets are cache hits (local disk + remote R2 cache), so their
#    coverage.dat is fetched, not recomputed -- every PR gets a COMPLETE report
#    with no dependence on Codecov carryforward.
#  * Splits the combined report per package for the `bazel-coverage-lcov`
#    artifact (line-level truth) and uploads the combined report — minus the
#    coverage-exempt files (tools/coverage/filter_lcov.py) — to Coveralls.
#  * Includes the BDD suite (--config=coverage flips the default tag filter to
#    -requires-cargo, see .bazelrc) so the service-binary integration paths are
#    covered; the spawned-binary coverage is collected via the vendored
#    rules_rust patches (effectiveness guarded by parity.yml).
#  * On PRs, posts a non-gating `uncovered-diff-lines` check run whose
#    annotations mark every uncovered added line inline in the Files changed
#    tab (diff-cover scores the diff; tools/coverage/post_check_annotations.py
#    posts the findings) — vendor-free, line-exact diff-coverage visibility.
permissions:
  contents: read
  # checks: write lets the annotation step attach the `uncovered-diff-lines`
  # check run to the PR head. Fork PRs get a read-only token regardless; the
  # poster treats the resulting 403 as a skip, not a failure.
  checks: write
  # pull-requests: read makes the annotate step's PR-diff fetch an explicit
  # grant instead of a side effect of the repo being public.
  pull-requests: read
on:
  pull_request:
  # push to main primes the coverage action cache (write token) so PRs read
  # warm coverage.dat for untouched targets; also gives main a coverage baseline.
  push:
    branches: [main]
  # Nightly run from main keeps the coverage action cache warm during quiet
  # stretches (mirrors bazel.yml) and refreshes the per-service badges.
  schedule:
    - cron: "33 7 * * *"
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
name: bazel-coverage

jobs:
  coverage:
    # Venue routing (ADR-020, docs/plans/proxmox-pr-routing.md): the coverage
    # leg runs on the ephemeral self-hosted pool for push-to-main and SAME-REPO
    # pull requests, gated on RP_POOL_LINUX — the same kill switch as bazel.yml's
    # Linux leg, because both Linux legs share one pool and a single flip must
    # evacuate both. Every falsy branch resolves to 'ubuntu-latest' (hosted): a
    # fork PR, the nightly schedule, an unset variable, or a null head.repo all
    # land on the safe side. The schedule staying hosted is deliberate — it keeps
    # the CLOUD cache's coverage entries warm for fork PRs, while push-to-main
    # warms the LAN cache. Keep the trusted-event test identical to bazel.yml's:
    # a divergence here is a security boundary moving.
    runs-on: >-
      ${{ (vars.RP_POOL_LINUX == 'on'
           && (github.event_name == 'push'
               || (github.event_name == 'pull_request'
                   && github.event.pull_request.head.repo.full_name == github.repository))
           && fromJSON('["self-hosted", "proxmox-ephemeral"]'))
          || 'ubuntu-latest' }}
    # Cold-cache headroom: the instrumented nightly graph is a distinct cache
    # namespace, so the first run (and post-eviction runs) rebuild it from
    # scratch -- and the instrumented BDD suite (rp ~150s warm) runs here too.
    # Warm runs are fast.
    timeout-minutes: 60
    name: bazel coverage
    defaults:
      run:
        shell: bash
    env:
      # Same trust model as bazel.yml: only push-to-main and the nightly schedule
      # (both default-branch events) hold the write token, so only trusted code
      # populates the coverage cache; PRs (including forks, which get no secrets
      # at all) read anonymously and never write.
      CACHE_WRITE_TOKEN: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && secrets.BAZEL_CACHE_WRITE_TOKEN || '' }}
      # LAN cache write credential, pool jobs only — same trusted-code gating as
      # bazel.yml. Only push-to-main writes the LAN bazel-remote the pool reads;
      # PR jobs on the pool read anonymously. The credential deliberately does
      # NOT live on the runner VM (any job on a self-hosted runner can read the
      # machine's filesystem), so it arrives only as this push-scoped secret.
      LAN_CACHE_WRITE_AUTH: ${{ github.event_name == 'push' && secrets.BAZEL_LAN_CACHE_WRITE_AUTH || '' }}
    steps:
      # The pool runner's .env supplies RP_LAN_CACHE_URL (a LAN address —
      # operator infrastructure, masked so it cannot appear in public logs).
      # Deliberately unconditional: a no-op on hosted runners (the var is empty
      # there), and not gated on runner.environment so the masking cannot be
      # skipped by a context quirk.
      - name: Mask runner-provided cache endpoint
        run: |
          if [[ -n "${RP_LAN_CACHE_URL:-}" ]]; then echo "::add-mask::$RP_LAN_CACHE_URL"; fi

      - uses: actions/checkout@v7

      # The provisioning steps below are hosted-only: the Linux pool template
      # ships lld, bazelisk, OmniSim, Pebble, and both camera SDKs at the same
      # pins, plus the coverage-specific one-time `bazel coverage` warmup that
      # pre-fetches the nightly toolchain + instrumented externals into its
      # output base (see docs/plans/proxmox-pr-routing.md R5). Re-downloading
      # any of this per ephemeral clone would defeat the pool's zero-WAN
      # property. COUPLING: bumping a pin in any of these steps requires
      # rebuilding the runner template — see docs/skills/proxmox-runner-pool.md.
      # .bazelrc build:linux uses the lld linker.
      - name: Install lld
        if: runner.environment == 'github-hosted'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lld >/dev/null

      - name: Setup bazelisk
        if: runner.environment == 'github-hosted'
        uses: bazelbuild/setup-bazelisk@v3
        with:
          bazelisk-version: 1.28.1

      - name: Verify bazel version
        run: bazel --version

      # rp's BDD scenarios spawn the ASCOM Alpaca simulator. OMNISIM_PATH is
      # forwarded into test sandboxes by .bazelrc `build:ci --test_env=OMNISIM_PATH`.
      - name: Install ASCOM OmniSim
        if: runner.environment == 'github-hosted'
        uses: ./.github/actions/install-omnisim
      - name: Install Pebble
        if: runner.environment == 'github-hosted'
        uses: ./.github/actions/install-pebble

      # `bazel coverage //...` instruments + compiles libqhyccd-sys (qhy-camera),
      # so provision the proprietary QHYCCD SDK + libusb. Linux only: the action
      # stages the libs into /usr/local/lib (build.rs's env-free search path). The
      # qhy-camera bdd + conformu suites are excluded from coverage by
      # `--test_tag_filters=-requires-cargo` (they only BUILD here), so the SDK
      # init hang under the test runner is moot.
      - name: Install libusb (qhy-camera)
        if: runner.environment == 'github-hosted'
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libusb-1.0-0-dev
          version: 1.0
      - name: Install QHYCCD SDK (qhy-camera)
        if: runner.environment == 'github-hosted'
        uses: ivonnyssen/qhyccd-sdk-install@v4
        with:
          version: "26.06.04"
      # zwo-camera links the native ZWO ASI/EFW SDK (zwo-rs -> libzwo-sys); the
      # coverage run is over the whole `//...` graph, so the SDK must be present
      # for Bazel to build/link/instrument zwo-camera. Linux-only runner here, so
      # this is the cheap INDI-mirror path. See services/zwo-camera/BUILD.bazel.
      - name: Install ZWO SDK
        if: runner.environment == 'github-hosted'
        uses: ./.github/actions/install-zwo-sdk

      - name: bazel coverage
        run: |
          set -uo pipefail
          REMOTE_FLAGS=(--config=remote-cache)
          if [[ -n "${RP_LAN_CACHE_URL:-}" ]]; then
            # Pool venue: --remote_cache after --config=remote-cache overrides
            # the cloud URL (last single-valued flag wins) while keeping the
            # config's timeout settings. Push-to-main writes the LAN cache's
            # coverage namespace; PR jobs on the pool read it anonymously.
            REMOTE_FLAGS+=(--remote_cache="$RP_LAN_CACHE_URL")
            if [[ -n "$LAN_CACHE_WRITE_AUTH" ]]; then
              REMOTE_FLAGS+=(--remote_header="Authorization=$LAN_CACHE_WRITE_AUTH")
            else
              REMOTE_FLAGS+=(--remote_upload_local_results=false)
            fi
          elif [[ -n "$CACHE_WRITE_TOKEN" ]]; then
            REMOTE_FLAGS+=(--remote_header="Authorization=Bearer $CACHE_WRITE_TOKEN")
          else
            REMOTE_FLAGS+=(--remote_upload_local_results=false)
          fi
          # --config=coverage selects the nightly channel + --cfg=coverage_nightly
          # + --combined_report=lcov + first-party instrumentation filter +
          # --test_timeout=900 (.bazelrc). --test_tag_filters=-requires-cargo
          # INCLUDES the BDD suite; it is also set by --config=coverage but pinned
          # here on the command line so CI is not sensitive to rc precedence
          # (command line always wins). --remote_download_outputs=all overrides
          # build:ci's `toplevel` so the combined lcov and its per-test .dat inputs
          # are materialised locally. --test_output=all surfaces rp:bdd's BDD-TRACE
          # breadcrumbs (ENTER / reset-ok / EXIT, tagged +Ns) even on a passing run
          # — parity with the BDD leg in bazel.yml. --spawn_strategy=local (the
          # confirmed rp:bdd post-scenario park fix) and --remote_timeout=15 are
          # inherited from `.bazelrc` test:ci/build:ci.
          #
          # `|| status=$?` keeps a non-zero exit from aborting the step and records
          # the code, so the classification below can distinguish bazel exit 3
          # (tests failed/timed out) from build/flag failures.
          #
          # observability (C): bound the run ~10 min below the 60-min job timeout.
          # `timeout --signal=INT 50m` interrupts bazel cleanly (it flushes the
          # in-progress test.log) with headroom for the always() capture step to run
          # unhurried, instead of a hard job-cancel at 60 min that flushes nothing.
          # --kill-after SIGKILLs if bazel ignores the INT. `timeout` exits 124 when
          # it fired (137 if it had to escalate to SIGKILL).
          status=0
          timeout --signal=INT --kill-after=2m 50m \
            bazel coverage --config=ci --config=coverage "${REMOTE_FLAGS[@]}" \
            --test_tag_filters=-requires-cargo \
            --remote_download_outputs=all \
            --test_output=all \
            //... || status=$?
          # Bazel exit codes: 0 = all tests passed (publish coverage below); ANY non-zero =
          # something did not validly complete, so we FAIL. Rationale: coverage from a run with
          # a failed/killed test (exit 3) — or a build/flag error — does not correspond to a
          # passing suite, so the number is misleading; we do NOT publish it (a non-zero exit
          # here skips the no-`if:` Split step, which is the intended behaviour). The always()
          # test-log capture step still runs regardless, so a failure is fully triage-able.
          # The rp:bdd post-scenario park (which could cancel ~half of these runs at the
          # 60-min wall) is fixed (bounded --remote_timeout + --spawn_strategy=local in .bazelrc);
          # this job is a required gate.
          if [[ $status -eq 124 || $status -eq 137 ]]; then
            echo "::error title=bazel coverage capped::Hit the 50-min observability cap (exit $status) — a test (almost certainly //services/rp:bdd) did not finish in time. Captured test logs are in the 'bazel-testlogs' artifact."
            exit 1
          elif [[ $status -eq 3 ]]; then
            echo "::error title=bazel coverage test failure::A coverage test FAILED or hit its --test_timeout (bazel exit 3). Coverage from a failed run does not reflect a passing suite, so it is NOT published. See the test logs below / in the 'bazel-testlogs' artifact."
            exit 1
          elif [[ $status -ne 0 ]]; then
            echo "::error title=bazel coverage failed::bazel coverage failed (exit $status — 1=build error, 2=bad flags, 4=no tests, 8=interrupted/superseded)."
            exit "$status"
          fi

      # Capture every test.log/test.xml out of the (symlinked) bazel-testlogs tree
      # so a coverage failure — including a timeout-cap SIGINT — is triageable from
      # the uploaded artifact. bazel only writes these when the action ends.
      - name: Capture bazel test logs
        if: always()
        run: |
          set +e +o pipefail  # best-effort: a find/tar miss must NOT fail the job.
          TESTLOGS="$(readlink -f bazel-testlogs 2>/dev/null || echo bazel-testlogs)"
          DEST=bazel-testlogs-captured
          mkdir -p "$DEST"
          # Copy out of the (symlinked) testlogs tree into a real dir so the upload
          # is clean and survives the symlink.
          if [[ -d "$TESTLOGS" ]]; then
            ( cd "$TESTLOGS" && find . \( -name test.log -o -name test.xml \) -print0 \
                | tar --null -cf - -T - ) | tar -C "$DEST" -xf - 2>/dev/null
          fi
          RP_BDD_LOG="$TESTLOGS/services/rp/bdd/test.log"
          if [[ -f "$RP_BDD_LOG" ]]; then
            echo "===== rp:bdd test.log tail (last 80 lines) ====="
            tail -80 "$RP_BDD_LOG"
          fi
          exit 0  # best-effort — must never fail the job

      - name: Upload bazel test logs (artifact)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bazel-testlogs
          path: bazel-testlogs-captured/**
          if-no-files-found: warn
          retention-days: 14

      - name: Split combined lcov per package
        run: |
          REPORT="$(bazel info output_path)/_coverage/_coverage_report.dat"
          echo "Combined report: $REPORT"
          if [[ ! -s "$REPORT" ]]; then
            echo "::error::combined coverage report missing or empty at $REPORT"
            exit 1
          fi
          ls -l "$REPORT"
          # The Coveralls upload gets the combined report minus the
          # coverage-exempt files (mock/test-helper binaries, examples), so
          # the published number matches the policy. The artifact below stays
          # unfiltered as line-level truth.
          python3 tools/coverage/filter_lcov.py "$REPORT" --output combined-coverage.info
          mkdir -p coverage-lcov
          python3 tools/coverage/split_lcov.py "$REPORT" --output-dir coverage-lcov
          ls -l coverage-lcov

      - name: Upload per-package lcov (artifact)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bazel-coverage-lcov
          path: coverage-lcov/*.info
          if-no-files-found: warn
          retention-days: 14

      # Coveralls is the coverage vendor: the README badge, the PR coverage
      # comment, and the repo-wide gates (COVERAGE THRESHOLD FOR FAILURE /
      # COVERAGE DECREASE THRESHOLD FOR FAILURE, set in the Coveralls repo
      # settings) all hang off this upload of the filtered combined report.
      - name: Upload to Coveralls
        if: env.ACT != 'true'
        uses: coverallsapp/github-action@v2
        with:
          file: combined-coverage.info
          format: lcov
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # On pull_request events the checkout is GitHub's ephemeral merge
          # commit, and Coveralls posts its coverage/coveralls status to the
          # commit it is told about — so report the PR head instead, or the
          # status lands on a SHA the PR checks UI (and the ruleset) never
          # sees. Same override the retired Codecov upload needed.
          git-commit: ${{ github.event.pull_request.head.sha || github.sha }}
          git-branch: ${{ github.head_ref || github.ref_name }}
          # A vendor hiccup must never fail this job. `bazel coverage` is a
          # required check, and an upload step that can redden it hands a third
          # party the power to block every merge -- which is the failure mode
          # this whole exercise exists to avoid.
          fail-on-error: false

      # In-diff coverage visibility, GitHub-native: diff-cover scores the PR
      # diff against this run's filtered report, and one annotation per
      # uncovered added line lands on a non-gating `uncovered-diff-lines`
      # check run on the PR head, where it renders inline in the Files
      # changed tab. No vendor involved — the same data the artifact holds,
      # shown where review happens. Every failure path here degrades to a run
      # warning: like the vendor upload above, a visibility feature must
      # never redden the required `bazel coverage` check.
      #
      # COUPLING: diff-cover comes from pip. On hosted runners the pinned
      # install below is a fresh download each run; the pool template should
      # bake python3-pip plus this exact pin so the same command is an
      # offline "already satisfied" no-op there (zero-WAN; see
      # docs/skills/proxmox-runner-pool.md). Until it does, the step skips
      # with a warning on pool runners that cannot install it.
      - name: Annotate uncovered diff lines
        if: github.event_name == 'pull_request' && env.ACT != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          if ! python3 -m pip install --user --quiet diff-cover==10.5.1; then
            echo "::warning::could not install diff-cover; skipping uncovered-line annotations"
            exit 0
          fi
          DIFF_COVER="$(python3 -c 'import site; print(site.USER_BASE)')/bin/diff-cover"
          # The checkout is a shallow merge commit, so `git diff` has no base
          # to compare against; the API serves the merge-base (three-dot)
          # diff — the lines this PR actually changes — and --diff-file hands
          # it to diff-cover without needing any git history. The API refuses
          # oversized diffs, which the -f catches like any other fault.
          if ! curl -sfS \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github.diff" \
              -o pr.diff \
              "${GITHUB_API_URL:-https://api.github.com}/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER"; then
            echo "::warning::could not fetch the PR diff; skipping uncovered-line annotations"
            exit 0
          fi
          if ! "$DIFF_COVER" combined-coverage.info --diff-file pr.diff \
              --format "json:diff-cover.json" --total-percent-float --quiet; then
            echo "::warning::diff-cover failed; skipping uncovered-line annotations"
            exit 0
          fi
          python3 tools/coverage/post_check_annotations.py diff-cover.json \
            --diff pr.diff --lcov combined-coverage.info \
            --repo "$GITHUB_REPOSITORY" --sha "$HEAD_SHA" \
            --details-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            || echo "::warning::posting uncovered-line annotations failed"
