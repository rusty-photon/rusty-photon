# Lint & quality checks.
#
# The clippy jobs answer different questions — be strict on stable (on every
# OS whose cfg'd code the deny set reaches), get a heads-up on beta. Keeping
# stable and beta apart is what lets the stable deny set widen without the
# nightly beta leg going red every time a group gains a lint.
#
# PR-gating (every pull_request + push to main) — these stay required because the
# per-PR Bazel build/test gate (bazel.yml) does NOT run rustfmt or clippy:
#   - fmt:    rustfmt formatting              (required check: `stable / fmt`)
#   - clippy: stable clippy, `-D warnings`    (required check: `stable / clippy`)
#
# Nightly schedule + workflow_dispatch only:
#   - clippy-beta: report-only beta clippy (`--cap-lints warn`), one tracking
#                  issue per lint. Never fails on a lint. Only the scheduled
#                  run acts on its census, so it skips push to main too.
#
# Nightly-only (schedule + push to main + workflow_dispatch; skipped on PRs via
# `if: github.event_name != 'pull_request'`):
#   - clippy-os:   stable clippy on windows + macos, `-D warnings` — enforces
#                  the deny set on the `#[cfg(windows)]` / `#[cfg(target_os =
#                  "macos")]` code the ubuntu gate never compiles (#984)
#   - hack:        cargo-hack feature-powerset (feature additivity)
#   - msrv:        verify the declared workspace MSRV
#
# notify-clippy-failure opens (or comments on) a `check-nightly`-labeled
# tracking issue when a scheduled clippy job fails, same pattern as
# safety.yml / conformu.yml / install-astap.yml / plate-solver-smoke.yml.
# Since clippy-beta no longer fails on lints, reaching it from there means a
# genuine break rather than an upstream lint addition; reaching it from
# clippy-os most likely means an OS-cfg'd lint violation landed on main.
permissions:
  contents: read
# fmt + clippy run on every PR and on push to main. `clippy-os`, `hack`, and
# `msrv` run on push to main plus the schedule and manual dispatch;
# `clippy-beta` runs on the schedule and manual dispatch alone. Each is
# guarded by its own `if:` below.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 06:00 UTC — offset from parity (06:45) and native (06:47) so the nightly
    # Cargo suites don't contend for the same hosted-runner pool minute.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      report_beta_lints:
        description: "Also open/update/close beta-clippy issues (normally schedule-only)"
        type: boolean
        default: false
# If new code is pushed to a PR branch, then cancel in progress workflows for that PR. Ensures that
# we don't waste CI time, and returns results quicker https://github.com/jonhoo/rust-ci-conf/pull/5
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
name: check
jobs:
  fmt:
    # Required PR gate. Bazel does not run rustfmt, so this stays on every PR.
    runs-on: ubuntu-latest
    name: stable / fmt
    steps:
      - uses: actions/checkout@v7
      - name: Install stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --check
  clippy:
    # Required PR gate. `-D warnings` here is what keeps `main` silent on
    # stable — which is in turn what makes every finding in clippy-beta below
    # new on the beta channel by construction, with no set-differencing needed.
    runs-on: ubuntu-latest
    name: stable / clippy
    steps:
      - uses: actions/checkout@v7
      - name: Install stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-stable
          save-if: false
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
  clippy-os:
    # The required gate above runs on ubuntu, so production code behind
    # `#[cfg(windows)]` / `#[cfg(target_os = "macos")]` is never compiled by
    # it — and nothing else substitutes: Bazel runs no clippy, and its
    # `-Dwarnings` is rustc's warning set, which never evaluates `clippy::`
    # tool lints. Without these legs an OS-gated violation of the workspace
    # deny set lands green in CI and then fails that OS's contributors'
    # pre-commit hooks (#984). One slice stays uncovered even here: this runs
    # `--all-features`, which turns `simulation` ON, so `#[cfg(all(windows,
    # not(feature = "simulation")))]` code is compiled by no clippy anywhere
    # (#988).
    #
    # Off-PR like `hack` / `msrv`: the cfg'd code changes rarely, so a
    # violation surfaces on main within minutes of a merge (push) or overnight
    # (schedule, via notify-clippy-failure) instead of taxing every PR with
    # two more runners. No OmniSim/Pebble and no `*_SKIP_NATIVE_LINK` env:
    # those matter only at test runtime / link time, and clippy neither runs
    # tests nor links (libzwo-sys's build.rs documents that a check/clippy
    # pass needs only libclang).
    if: github.event_name != 'pull_request'
    # A check-only clippy takes ~4 min; the cap guards a hang, not the norm
    # (test.yml's same-OS jobs carry the same defense).
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows, macos]
    runs-on: ${{ matrix.os }}-latest
    name: ${{ matrix.os }} / clippy
    steps:
      - uses: actions/checkout@v7
      - name: Install stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # Windows reuses the cache the nightly Cargo safety net (test.yml)
          # saves under this key; read-only so the two never race on the save.
          # The macOS leg runs cold every time: test.yml's macos job sets
          # RUSTFLAGS, which rust-cache folds into the key digest, so its
          # `macos-stable` entry can never match here. Accepted — a cold
          # check-only pass costs well under a minute extra.
          shared-key: ${{ matrix.os }}-stable
          save-if: false
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
  clippy-beta:
    # Early warning, never a gate. `--cap-lints warn` downgrades every lint the
    # workspace denies, so this job reports rather than fails — including for a
    # lint added to a group we deny, which under `-D warnings` would have turned
    # an upstream toolchain release into a red nightly. Findings are grouped by
    # lint and tracked one issue each so they get fixed in current code, on our
    # schedule, before the toolchain enforcing them reaches stable.
    #
    # A genuine compile break still fails the job; notify-clippy-failure catches
    # that.
    #
    # Nightly + manual dispatch only — deliberately NOT on push to main. Only
    # the scheduled run acts on the census, so a per-merge beta build would
    # compute a report nobody reads.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: beta / clippy
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - name: Install beta
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: beta
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-beta
          save-if: true
      - name: cargo clippy (report-only)
        run: |
          cargo clippy --version | tee toolchain.txt
          # The cap goes on clippy's own argument line rather than in RUSTFLAGS
          # so it applies to the workspace packages being linted and leaves
          # dependency artifacts cached.
          status=0
          cargo clippy --all-targets --all-features --message-format=json \
            -- --cap-lints warn > clippy.json || status=$?
          # `--message-format=json` moves the rendered diagnostics into the
          # JSON payload, so echo them back for anyone reading the run log.
          # Never let this displace clippy's own verdict (`bash -e`).
          jq -r 'select(.reason == "compiler-message") | .message.rendered // empty' clippy.json || true
          exit $status
      - name: Aggregate findings per lint
        run: |
          python3 tools/ci/beta_clippy_census.py \
            --root "$GITHUB_WORKSPACE" \
            --toolchain "$(cat toolchain.txt)" \
            --summary census.md \
            < clippy.json > census.json
          cat census.md >> "$GITHUB_STEP_SUMMARY"
      - name: Track each lint as an issue
        # Schedule only by default; `workflow_dispatch` can opt in, which is the
        # only way to exercise this path outside the nightly window.
        if: github.event_name == 'schedule' || inputs.report_beta_lints
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("fs");
            const census = JSON.parse(fs.readFileSync("census.json", "utf8"));
            const { owner, repo } = context.repo;
            const label = "beta-clippy";
            const prefix = "beta clippy: ";
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            // A toolchain that renames or splits many lints at once would open a
            // flood of issues, and truncating the set would make the auto-close
            // below wrongly retire the lints left out. Hand it to a human
            // instead — failing here surfaces via notify-clippy-failure.
            const maxLints = 20;
            if (census.lints.length > maxLints) {
              core.setFailed(
                `beta clippy reported ${census.lints.length} distinct lints ` +
                `(cap ${maxLints}); triage the census in the run summary rather ` +
                `than opening an issue per lint.`
              );
              return;
            }
            // Created on first use so the workflow needs no manual label setup.
            try {
              await github.rest.issues.createLabel({
                owner, repo, name: label, color: "ededed",
                description: "a lint beta clippy reports that stable does not yet",
              });
            } catch (error) {
              if (error.status !== 422) throw error; // 422 = already exists
            }
            const render = (entry) => {
              const shown = entry.sites.slice(0, 20);
              const lines = [
                `\`${entry.lint}\` fires **${entry.count}×** under the beta toolchain.`,
                ``,
                `\`stable / clippy\` is a required gate running \`-D warnings\`, so`,
                `\`main\` is silent on stable — this lint is new on the beta channel`,
                `and will start failing that gate when beta becomes stable. Fixing`,
                `it in current code now avoids a rushed sweep on the bump.`,
                ``,
                `> ${entry.example}`,
                ``,
              ];
              if (entry.docs) {
                lines.push(`Lint reference: ${entry.docs}`, ``);
              }
              lines.push(
                `**Sites** (showing ${shown.length} of ${entry.count}):`,
                ``,
                ...shown.map((site) => `- \`${site}\``),
                ``,
                `Toolchain: \`${census.toolchain}\``,
                `Last seen: ${runUrl}`,
                ``,
                `Opened automatically by the nightly \`beta / clippy\` job. This`,
                `body is rewritten on every run, and the issue closes itself once`,
                `the lint stops being reported.`,
              );
              return lines.join("\n");
            };
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: "open", labels: label,
            });
            const existing = new Map(open.map((issue) => [issue.title, issue]));
            const reported = new Set();
            for (const entry of census.lints) {
              const title = `${prefix}${entry.lint}`;
              reported.add(title);
              const body = render(entry);
              const match = existing.get(title);
              if (match) {
                await github.rest.issues.update({
                  owner, repo, issue_number: match.number, body,
                });
                core.info(`updated #${match.number} — ${title} (${entry.count} sites)`);
              } else {
                const created = await github.rest.issues.create({
                  owner, repo, title, body, labels: [label, "check-nightly"],
                });
                core.info(`opened #${created.data.number} — ${title} (${entry.count} sites)`);
              }
            }
            // A lint that stopped firing was either fixed here or dropped
            // upstream; retire its issue rather than leaving stale ones to be
            // triaged by hand. Only issues this job generated are eligible.
            for (const issue of open) {
              if (reported.has(issue.title) || !issue.title.startsWith(prefix)) {
                continue;
              }
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: `No longer reported by \`beta / clippy\` — closing.\n\nRun: ${runUrl}`,
              });
              await github.rest.issues.update({
                owner, repo, issue_number: issue.number,
                state: "closed", state_reason: "completed",
              });
              core.info(`closed #${issue.number} — ${issue.title}`);
            }
  notify-clippy-failure:
    # Open or update a tracking issue when a scheduled clippy job fails, so the
    # failure surfaces without depending on someone reading scheduled-workflow
    # logs. Skipped on push, pull_request, and workflow_dispatch so manual
    # debugging runs and required-PR-gate failures (already visible in the PR
    # itself) don't churn an issue.
    #
    # Note what this no longer covers: clippy-beta reports lints instead of
    # failing on them, and each gets its own `beta-clippy` issue. Reaching here
    # means something else broke — except via clippy-os, whose whole purpose is
    # to fail on an OS-cfg'd lint violation the ubuntu gate could not see.
    needs: [clippy, clippy-os, clippy-beta]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update tracking issue
        uses: actions/github-script@v9
        with:
          script: |
            const title = `nightly: check clippy failing`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `A clippy job in the nightly check workflow failed (\`stable /`,
              `clippy\`, \`windows / clippy\`, \`macos / clippy\`, and/or`,
              `\`beta / clippy\`).`,
              ``,
              `Which job failed says what to suspect. For \`windows / clippy\` /`,
              `\`macos / clippy\` a *lint* IS the likely cause: those legs exist to`,
              `catch violations in \`#[cfg(windows)]\` / \`#[cfg(target_os =`,
              `"macos")]\` code that the required ubuntu gate never compiles`,
              `(#984). For the other two a lint is *not* likely: \`beta / clippy\``,
              `runs with \`--cap-lints warn\` and files one \`beta-clippy\`-labeled`,
              `issue per lint instead of failing, so what reached here is more`,
              `likely a compile break, a warning newly emitted by a stable`,
              `toolchain bump, or the reporting step itself. Inspect the failed`,
              `job in the linked run.`,
              ``,
              `Run: ${runUrl}`,
              ``,
              `This issue was opened automatically by a scheduled run that`,
              `failed. While it stays open, each subsequent scheduled failure`,
              `is appended here as a comment linking its own run. Closing it`,
              `marks the failure handled — it is never re-opened; the next`,
              `scheduled failure opens a fresh issue instead.`,
            ].join("\n");
            // Search only OPEN issues. While a tracking issue is open each
            // failure appends a comment; once it is closed the failure is
            // considered handled, so the next scheduled failure opens a
            // fresh issue rather than resurrecting the closed one.
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "check-nightly",
            });
            const match = existing.find(i => i.title === title);
            if (match) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                body: `Failed again — run: ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["check-nightly", "ci-flake"],
              });
            }
  hack:
    # cargo-hack checks combinations of feature flags to ensure that features are
    # all additive (required for feature unification). Bazel is the per-PR build
    # gate, so this runs nightly as a Cargo-only safety net. Skipped on PRs via
    # the event guard.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    name: ubuntu / stable / features
    steps:
      - uses: actions/checkout@v7
      - name: Install stable
        uses: dtolnay/rust-toolchain@stable
      - name: cargo install cargo-hack
        uses: taiki-e/install-action@cargo-hack
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-stable
          save-if: false
      # intentionally no target specifier; see https://github.com/jonhoo/rust-ci-conf/pull/4
      # --feature-powerset runs for every combination of features
      - name: cargo hack
        run: cargo hack --feature-powerset check
  msrv:
    # check that we can build using the declared minimum rust version.
    # Nightly-only (never gated PRs); skipped on PRs via the event guard.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    name: ubuntu / msrv
    steps:
      - uses: actions/checkout@v7
      - name: Install cargo-msrv
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-msrv
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-stable
          save-if: false
      - name: Verify workspace MSRV
        run: |
          # cargo-msrv doesn't resolve [workspace.package].rust-version from
          # virtual workspace roots, so verify each member individually.
          #
          # Skip the four dual-homed FFI crates (qhyccd-rs + libqhyccd-sys, zwo-rs
          # + libzwo-sys): they declare lower, independent MSRVs that CANNOT be
          # verified in-workspace — the root `[profile.dev] debug =
          # "line-tables-only"` needs Rust >= 1.71 and the shared Cargo.lock pins
          # newest deps. publish-readiness.yml verifies them OUT of the workspace
          # instead. The skip set = every crate carrying
          # [package.metadata.publish-readiness] plus its declared `sys-crate`.
          meta="$(cargo metadata --format-version 1 --no-deps)"
          skip="$(echo "$meta" | jq -c '[.packages[]
                  | select(.metadata["publish-readiness"])
                  | (.name, .metadata["publish-readiness"]["sys-crate"])] | unique')"
          echo "Skipping (verified out-of-workspace by publish-readiness.yml): $(echo "$skip" | jq -r 'join(", ")')"
          echo "$meta" | jq -r --argjson skip "$skip" \
            '.packages[] | select(.rust_version)
             | select(.name as $n | ($skip | index($n)) | not)
             | .manifest_path' | \
          while IFS= read -r manifest; do
            echo "::group::$(basename "$(dirname "$manifest")")"
            cargo msrv verify --manifest-path "$manifest"
            echo "::endgroup::"
          done
