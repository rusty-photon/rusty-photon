# This workflow runs when a version tag is pushed (e.g., v0.1.0).
# It builds platform-specific packages and creates a GitHub Release:
# - Linux: every packaged service as a .deb and an .rpm for amd64 and arm64,
#   each built natively and lifecycle-verified
# - macOS: per-service arm64 tarballs for the whole family, brew-verified
#   (Intel macOS is not a target: docs/packaging-macos.md)
# - Windows: one suite .msi for the whole family (x86_64)
# - Homebrew: regenerates the tap's stable formulas (rusty-photon-<svc>.rb
#   × every packaged service + the rusty-photon meta-formula) via
#   `cargo ci brew-formulas` — the same renderer the nightly channel uses
#   for the -nightly siblings
# Only the release job writes to this repository. The build legs run every
# service's build and download the vendor SDKs, so none of them holds a
# token that can push or edit a release.
permissions:
  contents: read
on:
  push:
    tags:
      - "v*"
name: release
env:
  CARGO_TERM_COLOR: always
jobs:
  # Every packaged service's .deb and .rpm, built natively on each
  # architecture and verified by the same tools the nightly's linux legs
  # run. The tag is checked against the workspace version by the guard
  # build-windows uses, not by `cargo ci build-packages --version`, which
  # would stamp the debs without the `-1` revision an on-demand build of
  # the same version carries.
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    name: linux / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Check tag matches the workspace version
        id: v
        uses: ./.github/actions/packages/release-version
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: nightly-packages-${{ matrix.arch }}
      - name: Cache staged SDKs
        uses: actions/cache@v6
        with:
          path: ~/.cache/rusty-photon-pkg
          key: rusty-photon-pkg-${{ matrix.arch }}-${{ hashFiles('tools/rusty-photon-ci/src/packaging/qhy.rs', '.github/actions/install-zwo-sdk/zwo-sdk.mjs', '.github/actions/install-svbony-sdk/svbony-sdk.mjs') }}
      - name: Build packages
        run: cargo ci build-packages --rpm
      - name: Verify deb packages (release gate)
        run: cargo ci verify-packages --dist 'dist/${{ steps.v.outputs.version }}'
      - name: Verify rpm packages (release gate, Fedora)
        run: cargo ci verify-packages --rpm --dist 'dist/${{ steps.v.outputs.version }}'
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/${{ steps.v.outputs.version }}/*.deb
            dist/${{ steps.v.outputs.version }}/*.rpm
          if-no-files-found: error

  # Per-service arm64 tarballs — the Homebrew formula payloads — built and
  # verified by the same tools the nightly macos leg runs. Passing the tag
  # version to `cargo ci build-tarballs` doubles as the tag/workspace guard:
  # it refuses any version that is not the workspace version (or a +nightly
  # stamp on it).
  build-macos:
    runs-on: macos-latest
    name: macos / arm64 tarballs
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Strip the v prefix off the tag
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: nightly-packages-macos
      - name: Cache staged SDKs
        uses: actions/cache@v6
        with:
          path: ~/.cache/rusty-photon-pkg
          key: rusty-photon-pkg-macos-${{ hashFiles('tools/rusty-photon-ci/src/packaging/qhy.rs', '.github/actions/install-zwo-sdk/zwo-sdk.mjs') }}
      - name: Build the per-service tarballs
        run: cargo ci build-tarballs --version '${{ steps.v.outputs.version }}'
      - name: Verify via Homebrew (release gate)
        run: cargo ci verify-brew --channel stable --dist 'dist/${{ steps.v.outputs.version }}'
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos-tarballs
          path: dist/${{ steps.v.outputs.version }}/*.tar.gz
          if-no-files-found: error

  # The suite MSI: every service in one installer, built by the same
  # tools the msi workflow exercises on PRs. `cargo ci verify-msi` is the
  # release gate — the full install -> per-service-class checks -> feature-remove ->
  # uninstall lifecycle must pass before the MSI can ship.
  build-windows:
    runs-on: windows-latest
    name: windows / suite msi
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-msi
      # `cargo ci build-msi` stamps the MSI with the workspace version, so a tag
      # that names another would release wrongly versioned binaries under a
      # right-named tag.
      - name: Check tag matches the workspace version
        uses: ./.github/actions/packages/release-version
      - name: Build the suite MSI
        run: cargo ci build-msi
      - name: Verify the MSI lifecycle (release gate)
        run: cargo ci verify-msi
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-msi
          path: dist/**/*.msi

  release:
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    name: create release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd artifacts
          find . -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*.msi" -o -name "*.tar.gz" \) \
            -exec sh -c 'sha256sum "$1" | sed "s|  \./|  |"' _ {} \; \
            | sort -k2 > ../SHA256SUMS.txt
          cat ../SHA256SUMS.txt
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.msi
            artifacts/**/*.tar.gz
            SHA256SUMS.txt

  update-homebrew:
    needs: [release]
    runs-on: ubuntu-latest
    name: update homebrew tap
    steps:
      # The tap changes through the API, so no step pushes from a clone.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Strip the v prefix off the tag
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Download macOS tarballs
        uses: actions/download-artifact@v8
        with:
          name: macos-tarballs
          path: artifacts
      # The published release's checksum manifest is what the meta-formula
      # downloads, so the generator needs it to stamp the sha256.
      - name: Fetch the release checksum manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --pattern SHA256SUMS.txt --dir artifacts
      # The formula renderer is the tools crate's brew-formulas, which
      # `cargo ci` builds from this checkout.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Render the stable formulas
        run: |
          cargo ci brew-formulas --channel stable \
            --version "${GITHUB_REF_NAME#v}" \
            --dist artifacts \
            --url-base "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}" \
            --output stable-formulas
      # Replaces the stable set wholesale: a dropped service must not
      # linger, and the tap's hand-stamped filemonitor.rb, which the
      # rendered rusty-photon-filemonitor.rb replaces, goes too. The -nightly
      # siblings belong to nightly-packages.yml and are left alone. A re-run
      # for the same tag renders the same formulas and commits nothing.
      - name: Commit the stable formulas to the tap
        uses: ./.github/actions/packages/tap
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          channel: stable
          version: ${{ steps.v.outputs.version }}
          formulas: stable-formulas
