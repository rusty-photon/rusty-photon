# Cargo build + test — nightly safety net.
#
# Bazel (bazel.yml + bazel-coverage.yml) is the per-PR build / test / coverage
# gate. This workflow runs on a nightly schedule (+ push to main + manual
# dispatch) and exercises the FULL workspace as a Cargo safety net.
#
# Jobs:
# - required: workspace build + nextest + BDD + doctests on ubuntu/stable
# - macos / windows: the same on the other two host OSes
#   (Windows BDD runs in one job here — on a nightly run the ~10m sequential
#    per-scenario spawn cost is irrelevant, so it is not split per-service.)
#   The macOS job additionally denies rustc warnings, because no per-PR check
#   does that for macOS any more — see its `env:` block.
# - notify-macos-failure: a `macos-nightly` tracking issue when the scheduled
#   run's macOS job fails
#
# Coverage is NOT collected here: `bazel coverage` (bazel-coverage.yml) is the
# sole coverage source (combined report uploaded to Coveralls).
permissions:
  contents: read
on:
  push:
    branches: [main]
  schedule:
    # 08:00 UTC — after the 07:0x–07:1x nightly cluster (bazel 07:07, scheduled
    # 07:07, safety 07:17) so the full-workspace Cargo run doesn't contend with
    # them for the hosted-runner pool minute.
    - cron: "0 8 * * *"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
name: test
env:
  # Every job builds the zwo + qhy + svbony camera crates on their
  # `--all-features` (simulation) path, which `cfg`s out the real FFI and
  # references no SDK symbols. These tell libzwo-sys / libqhyccd-sys /
  # libsvbony-sys build.rs to omit the native link directives, so the whole
  # workspace builds with NO ZWO, QHYCCD, or SVBony SDK to provision (the
  # ZWO/SVBony links would otherwise be forced unconditionally even under
  # `simulation`) — and no libusb either, since the QHYCCD static lib that
  # pulls it in is never linked. The REAL native link + FFI is verified
  # separately by the `native` workflow (nightly + on camera-crate changes),
  # plus Bazel and the Pi nightly.
  ZWO_SKIP_NATIVE_LINK: "1"
  QHYCCD_SKIP_NATIVE_LINK: "1"
  SVBONY_SKIP_NATIVE_LINK: "1"
jobs:
  required:
    runs-on: ubuntu-latest
    # Explicit job timeout. Without one, GitHub's default is 360 min (6 h): a BDD
    # hang in `cargo test --test bdd` could silently burn a full 6 h. The root
    # cause (rp's `do_capture` looping forever on a failed exposure) is fixed at
    # the source; this cap is defense-in-depth. Generous because the nightly run
    # exercises the FULL workspace BDD suite.
    timeout-minutes: 45
    name: ubuntu / stable
    steps:
      - uses: actions/checkout@v7
      - name: Install ASCOM OmniSim
        uses: ./.github/actions/install-omnisim
      - name: Install Pebble
        uses: ./.github/actions/install-pebble
      - name: Install stable
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-nextest
        uses: taiki-e/install-action@cargo-nextest
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-stable
      - name: cargo generate-lockfile
        if: hashFiles('Cargo.lock') == ''
        run: cargo generate-lockfile
      # Pre-build all targets (bins + test/bench/example targets) so nextest
      # and BDD tests find cached binaries without recompilation.
      - name: cargo build
        run: cargo build --locked --workspace --all-features --all-targets
      - name: cargo nextest run
        run: cargo nextest run --locked --workspace --all-features --all-targets
      # BDD tests use a custom harness (bdd_main!) incompatible with nextest, so
      # they run separately. The action builds every bdd target once and runs the
      # binaries as parallel streams, sharding the suites that support it: cargo
      # runs test binaries one after another and cucumber serializes every
      # `@serial` feature, so a single process spends most of the suite's wall
      # clock with one scenario in flight.
      - name: cargo test --test bdd (sharded)
        uses: ./.github/actions/bdd-sharded
      - name: Upload OmniSim logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: omnisim-logs-ubuntu-stable
          path: '**/bdd-infra-omnisim-logs/**'
          if-no-files-found: ignore
          retention-days: 14
      # https://github.com/rust-lang/cargo/issues/6669
      - name: cargo test --doc
        run: cargo test --locked --workspace --all-features --doc
  macos:
    runs-on: macos-latest
    timeout-minutes: 45
    name: macos-latest
    env:
      # macOS has no per-PR deny-warnings gate: bazel.yml's macOS leg is
      # push-to-main + nightly only, and check.yml's per-PR clippy runs on
      # ubuntu alone (its off-PR `macos / clippy` leg overlaps this compile
      # set, but only off-PR — same cadence as this job, kept as a second
      # net). A warning that fires on macOS and nowhere else — the dead-code
      # class that Bazel's `-Dwarnings` settings exist for — would otherwise
      # only be printed, never enforced. Denying here covers the Cargo target
      # set, which `--all-targets --all-features` reaches further into than
      # the Bazel graph does. Registry dependencies are unaffected: Cargo
      # caps their lints, the same exemption crate_universe gives them under
      # Bazel.
      RUSTFLAGS: "-Dwarnings"
    steps:
      - uses: actions/checkout@v7
      - name: Install ASCOM OmniSim
        uses: ./.github/actions/install-omnisim
      - name: Install Pebble
        uses: ./.github/actions/install-pebble
      - name: Install stable
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-nextest
        uses: taiki-e/install-action@cargo-nextest
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-stable
      - name: cargo generate-lockfile
        if: hashFiles('Cargo.lock') == ''
        run: cargo generate-lockfile
      - name: cargo build
        run: cargo build --locked --workspace --all-features --all-targets
      - name: cargo nextest run
        run: cargo nextest run --locked --workspace --all-features --all-targets
      # The macOS USB collector's live test is ignored by default: it needs a
      # device on the bus, which a contributor's Mac may lack and these
      # runners have (two virtual ones). It runs here by name, and a filter
      # that matches no test fails the step, so a rename cannot skip it.
      - name: macOS USB collector against the runner's bus
        run: >-
          cargo nextest run --locked --workspace --all-features --all-targets
          --run-ignored only --no-tests fail
          -E 'package(rusty-photon-doctor-checks) & test(=facts::tests::test_the_collector_reads_a_bus_with_devices_as_one)'
      - name: cargo test --test bdd (sharded)
        uses: ./.github/actions/bdd-sharded
      - name: Upload OmniSim logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: omnisim-logs-macos-latest
          path: '**/bdd-infra-omnisim-logs/**'
          if-no-files-found: ignore
          retention-days: 14
  windows:
    # Windows nextest + BDD in one job. Windows spawns a process per scenario, so
    # its BDD wall clock is the highest of the three. The suites still share one
    # job here rather than splitting per service the way conformu.yml's Windows
    # leg does: that split exists to dodge cargo's build-directory lock, and the
    # action runs already-built binaries, so no cargo process contends for it.
    runs-on: windows-latest
    timeout-minutes: 60
    name: windows / nextest
    steps:
      - uses: actions/checkout@v7
      - name: Install ASCOM OmniSim
        uses: ./.github/actions/install-omnisim
      - name: Install Pebble
        uses: ./.github/actions/install-pebble
      - name: Install stable
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-nextest
        uses: taiki-e/install-action@cargo-nextest
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-stable
      - name: cargo generate-lockfile
        if: hashFiles('Cargo.lock') == ''
        run: cargo generate-lockfile
      - name: cargo build
        run: cargo build --locked --workspace --all-features --all-targets
      - name: cargo nextest run
        run: cargo nextest run --locked --workspace --all-features --all-targets
      - name: cargo test --test bdd (sharded)
        uses: ./.github/actions/bdd-sharded
      - name: Upload OmniSim logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: omnisim-logs-windows
          path: '**/bdd-infra-omnisim-logs/**'
          if-no-files-found: ignore
          retention-days: 14
  notify-macos-failure:
    # Open or update a tracking issue when the nightly macOS job fails. No PR
    # builds or tests on macOS, so a macOS-only break lands on main, and
    # without this nobody is told. Only the macOS job, and only on the
    # schedule: Bazel builds and tests Linux and Windows on every PR, and a
    # push-to-main failure is left to show on its commit.
    #
    # cancelled() alongside failure(): a job killed by timeout-minutes reports
    # conclusion "cancelled", not "failure" — failure() alone silently misses
    # it. Safe to OR in here: this workflow only triggers on push/schedule/
    # workflow_dispatch (github.head_ref is always empty for those), so the
    # concurrency group above always falls back to the per-run github.run_id
    # and can never cancel one of this workflow's own runs via supersession —
    # every "cancelled" conclusion this can see is a genuine timeout (or a
    # human explicitly cancelling, which is worth surfacing too).
    needs: macos
    if: (failure() || cancelled()) && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      # The action and the helpers it imports, nothing else.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/actions/tracking-issue
            .github/actions/lib
      - name: Open or update tracking issue
        uses: ./.github/actions/tracking-issue
        with:
          title: "nightly: test / macos-latest failing"
          label: macos-nightly
          body: |
            The nightly test workflow's `macos-latest` job failed.

            Likely causes: a test that fails on macOS alone, or a rustc warning
            that fires on macOS alone (the job denies warnings through
            `RUSTFLAGS=-Dwarnings`, which nothing on a PR does for macOS); or a
            problem with the hosted macOS runner or a tool the job installs.
            Inspect the failed job in the linked run.
