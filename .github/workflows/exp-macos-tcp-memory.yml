# Throwaway proof, exp/ branch only, never merged: does a longer TCP
# retransmit slop let the Bazel client's loopback connection outlast the bursts
# of loss that, past ~18 s, make the server's kernel drop it (the macOS wedge)?
# Each job is bazel.yml's macOS build, reading the cache anonymously and
# uploading nothing, with the kernel's counters read around it and the stall
# probe's capture of the client-server connection read after it.
name: exp-macos-tcp-memory
on:
  push:
    branches: [exp/macos-tcp-memory-proof]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        slop: ["3000"]
        run: [1, 2, 3, 4, 5, 6, 7, 8]
        include:
          - slop: "default"
            run: 1
          - slop: "default"
            run: 2
    runs-on: macos-latest
    name: macos slop=${{ matrix.slop }} run ${{ matrix.run }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      CACHE_WRITE_TOKEN: ""
      LAN_CACHE_WRITE_AUTH: ""
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/remote-cache
      - uses: bazelbuild/setup-bazelisk@v3
        with:
          bazelisk-version: 1.28.1
      - run: bazel --version
      - uses: ./.github/actions/install-omnisim
      - uses: ./.github/actions/install-pebble
      - run: brew install libusb
      - uses: ivonnyssen/qhyccd-sdk-install@v4
        with:
          version: "26.06.04"
      - uses: ./.github/actions/install-zwo-sdk
      - name: Lengthen the TCP retransmit slop
        if: matrix.slop != 'default'
        run: sudo sysctl -w net.inet.tcp.rexmt_slop=${{ matrix.slop }}
      - name: Before the build
        run: |
          sudo python3 -I exp-tcp-memory/measure.py before
          sudo nohup python3 -I exp-tcp-memory/measure.py sample "$RUNNER_TEMP/tcp-memory.txt" >/dev/null 2>&1 &
      - name: bazel build (watched for a stall)
        timeout-minutes: 15
        uses: ./.github/actions/bazel-stall-probe
        with:
          args: build --config=ci --config=ci-remote //...
      - name: After the build
        if: always()
        run: sudo python3 -I exp-tcp-memory/measure.py after "$RUNNER_TEMP/tcp-memory.txt" "$RUNNER_TEMP/bazel-stall-probe.pcap"
