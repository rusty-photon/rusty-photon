# ASCOM ConformU conformance suite for every service that opts in via
# `[package.metadata.conformu]` in its Cargo.toml.
#
# Cadence: nightly cron + workflow_dispatch (manual) + paths-filtered
# PR/push on this workflow file itself. ConformU exercises the running
# Alpaca server end-to-end across three OSes, so it is the single most
# expensive workflow we have. Running it on every push and PR was
# overkill: conformance regressions are real but rare, and the faster
# `check`/`test` workflows already gate the unit-level changes that
# would most often break conformance. A nightly run catches drift
# without paying the matrix on every PR; `workflow_dispatch` covers the
# "I just touched the Alpaca interface, run it now" case. The paths
# filter keeps PR-time validation on edits to this workflow itself,
# so a YAML or github-script regression is caught before merge rather
# than only at the next cron fire. The `notify-on-failure` job opens
# or updates a tracking issue so a red nightly does not sit unnoticed
# in the Actions tab.
permissions:
  contents: read

on:
  schedule:
    # Daily at 05:30 UTC. Offset from install-astap (04:30) and
    # plate-solver-smoke (03:30) so the three nightly suites do not
    # contend for the same hosted-runner pool minute.
    - cron: "30 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/actions/cargo-workspace/**"
      - ".github/workflows/conformu.yml"
  pull_request:
    paths:
      - ".github/actions/cargo-workspace/**"
      - ".github/workflows/conformu.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  # The qhy-camera ConformU run builds with `--features conformu`
  # (-> mock -> simulation), which `cfg`s out the real FFI and references no SDK
  # symbols, so QHYCCD_SKIP_NATIVE_LINK omits the SDK link directives: no QHYCCD
  # SDK or libusb is provisioned here. (zwo-camera and svbony-camera still link
  # their real SDKs, provisioned below.) The real QHYCCD native link is covered
  # by the `native` workflow + the Pi nightly.
  QHYCCD_SKIP_NATIVE_LINK: "1"

jobs:
  plan:
    runs-on: ubuntu-latest
    name: plan
    outputs:
      services: ${{ steps.discover.outputs.packages }}
      has_services: ${{ steps.discover.outputs.found }}
    steps:
      - uses: actions/checkout@v7
      # Every conformu-tagged service runs, on every OS: this cadence has no
      # PR base to diff against, and catching drift across the full surface
      # is the point. Services whose native SDK cannot be provisioned on a
      # given runner build against their `simulation` backend there instead
      # of dropping out ("provision, don't exclude" — ADR-008).
      - name: Discover ConformU services
        id: discover
        uses: ./.github/actions/cargo-workspace/packages
        with:
          table: conformu

  # Ubuntu and macOS: run all conformu tests in parallel within a single job.
  conformu:
    name: ${{ matrix.os }}
    needs: plan
    if: needs.plan.outputs.has_services == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os == 'Linux' && 'linux-stable' || 'macos-stable' }}
          save-if: false

      - name: Install ConformU
        uses: ivonnyssen/conformu-install@v3

      # The conformu_integration tests drive ConformU via bdd_infra::run_conformu,
      # which runs the tool only when CONFORMU_PATH points at it (and self-skips
      # otherwise). The install action puts conformu on PATH; surface its absolute
      # path so the tests actually run. Fail loudly if it's missing — a silent
      # skip here would make the whole conformance workflow a no-op.
      - name: Export CONFORMU_PATH
        shell: bash
        run: |
          CONFORMU_PATH="$(command -v conformu || command -v conformu.exe || true)"
          if [ -z "$CONFORMU_PATH" ]; then
            echo "conformu not found on PATH after install"; exit 1
          fi
          echo "CONFORMU_PATH=$CONFORMU_PATH" >> "$GITHUB_ENV"

      - name: cargo generate-lockfile
        if: hashFiles('Cargo.lock') == ''
        run: cargo generate-lockfile

      # qhy-camera's ConformU build uses `--features conformu` (-> simulation), and
      # the --workspace pre-build runs with QHYCCD_SKIP_NATIVE_LINK (workflow env),
      # so the QHYCCD SDK link is omitted — no SDK / libusb / dylib-loader setup.
      # zwo-camera and zwo-focuser (and the vendored zwo-rs/libzwo-sys members)
      # DO link the native ZWO SDK; provision it so the full-workspace pre-build
      # links — no exclusion.
      - name: Install ZWO SDK
        uses: ./.github/actions/install-zwo-sdk

      # svbony-camera's build.rs links the real SVBony SDK unconditionally,
      # exactly like ZWO above (not QHYCCD's cfg'd-out-under-simulation
      # posture — see the env comment at the top of this file), so this job
      # provisions it too. indi-3rdparty ships no `mac_arm64` blob (see the
      # header comment of install-svbony-sdk/svbony-sdk.mjs for the
      # byte-level verification) and `macos-latest` is Apple Silicon today,
      # so the "provision, don't exclude" principle (ADR-008) cannot apply to
      # that one leg the way it does for ZWO: fall back to
      # SVBONY_SKIP_NATIVE_LINK=1 there instead (the same posture QHYCCD
      # takes in this job everywhere), so
      # svbony-camera's ConformU coverage on macOS is protocol-conformance-
      # only until a verified Apple Silicon SVBony blob exists (see
      # docs/plans/archive/svbony-camera.md "Packaging"). Linux always gets the real
      # link; a future x86_64 macOS leg (e.g. macos-13) would too.
      - name: Install SVBony SDK (real link)
        if: runner.os == 'Linux' || runner.arch == 'X64'
        uses: ./.github/actions/install-svbony-sdk

      - name: Skip SVBony native link (macOS arm64 — no confirmed blob)
        if: runner.os == 'macOS' && runner.arch != 'X64'
        shell: bash
        run: echo "SVBONY_SKIP_NATIVE_LINK=1" >> "$GITHUB_ENV"

      - name: Pre-build workspace
        run: cargo build --locked --workspace --all-features --all-targets

      - name: Run ConformU tests (parallel)
        shell: bash
        timeout-minutes: 30
        run: |
          # All suites run concurrently. (This was briefly serialized on a
          # mistaken "macOS runner CPU starvation" theory; the real cause of the
          # zwo-camera macOS StartExposure timeout was a driver bug — the exposure
          # integration loop summed intended sleep time instead of honouring a
          # real-clock deadline — fixed in services/zwo-camera/src/backend.rs.)
          SERVICES='${{ needs.plan.outputs.services }}'
          COUNT=$(echo "$SERVICES" | jq 'length')

          echo "Running $COUNT ConformU services"
          pids=()
          cmds=()
          for i in $(seq 0 $((COUNT - 1))); do
            name=$(echo "$SERVICES" | jq -r ".[$i].name")
            cmd=$(echo "$SERVICES" | jq -r ".[$i].command")
            echo "::group::Starting $name"
            echo "Command: $cmd"
            echo "::endgroup::"
            # Run in a subshell that exits with the ConformU command's status,
            # NOT sed's. A bare `cmd | sed &` makes `$!` the sed PID, so the
            # `wait` loop below would see sed's (always-0) exit and mask a
            # failing ConformU run. `exit ${PIPESTATUS[0]}` propagates the real
            # status to the subshell, which `$!` now captures.
            ( eval "$cmd" 2>&1 | sed "s/^/[$name] /"; exit "${PIPESTATUS[0]}" ) &
            pids+=($!)
            cmds+=("$name")
          done

          failed=0
          for i in "${!pids[@]}"; do
            if ! wait "${pids[$i]}"; then
              echo "::error::${cmds[$i]} failed"
              failed=1
            else
              echo "${cmds[$i]} passed"
            fi
          done
          exit $failed

  # Windows: per-service jobs to avoid cargo lock contention.
  conformu-windows:
    name: windows / ${{ matrix.service.name }}
    needs: plan
    # `matrix` is not an available context in a job-level `if` (only `github`,
    # `needs`, `vars`, `inputs`), and referencing it here fails workflow
    # validation for the whole file, so per-service conditions belong on the
    # steps.
    if: needs.plan.outputs.has_services == 'true'
    runs-on: windows-latest
    # In env (not a secret reference in step `if:`s, where the secrets
    # context is unavailable) so the SVBony steps below can gate on its
    # presence: this workflow only runs on schedule/dispatch, so the repo's
    # own runs always have it — the empty case is a fork without the secret.
    env:
      PRIVATE_MIRROR_TOKEN: ${{ secrets.PRIVATE_MIRROR_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.plan.outputs.services) }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-stable
          save-if: false

      - name: Install ConformU
        uses: ivonnyssen/conformu-install@v3

      # The conformu_integration tests drive ConformU via bdd_infra::run_conformu,
      # which runs the tool only when CONFORMU_PATH points at it (and self-skips
      # otherwise). The install action puts conformu on PATH; surface its absolute
      # path so the tests actually run. Fail loudly if it's missing — a silent
      # skip here would make the whole conformance workflow a no-op.
      - name: Export CONFORMU_PATH
        shell: bash
        run: |
          CONFORMU_PATH="$(command -v conformu || command -v conformu.exe || true)"
          if [ -z "$CONFORMU_PATH" ]; then
            echo "conformu not found on PATH after install"; exit 1
          fi
          echo "CONFORMU_PATH=$CONFORMU_PATH" >> "$GITHUB_ENV"

      - name: cargo generate-lockfile
        if: hashFiles('Cargo.lock') == ''
        run: cargo generate-lockfile

      # qhy-camera's ConformU build uses `--features conformu` (-> simulation) with
      # QHYCCD_SKIP_NATIVE_LINK (workflow env), so no QHYCCD SDK is provisioned.
      # Per-service matrix: each leg installs only the SDK its own service
      # links (ZWO here, SVBony below).
      - name: Install ZWO SDK
        if: matrix.service.name == 'zwo-camera' || matrix.service.name == 'zwo-focuser'
        uses: ./.github/actions/install-zwo-sdk

      # svbony-camera's `--features conformu` build resolves to the simulation
      # backend (no camera needed) but still links the real SDK, matching the
      # Linux/macOS job above. Windows provisioning comes from the private CI
      # mirror (ADR-018 §7); a fork without the PRIVATE_MIRROR_TOKEN secret
      # falls back to SVBONY_SKIP_NATIVE_LINK=1, which drops only the real
      # link — the conformance run itself needs no SDK.
      - name: Install SVBony SDK (real link)
        if: matrix.service.name == 'svbony-camera' && env.PRIVATE_MIRROR_TOKEN != ''
        uses: ./.github/actions/install-svbony-sdk
        with:
          windows-mirror-token: ${{ secrets.PRIVATE_MIRROR_TOKEN }}

      - name: Skip SVBony native link (no mirror token)
        if: matrix.service.name == 'svbony-camera' && env.PRIVATE_MIRROR_TOKEN == ''
        shell: bash
        run: echo "SVBONY_SKIP_NATIVE_LINK=1" >> "$GITHUB_ENV"

      - name: Pre-build
        run: cargo build --locked --package ${{ matrix.service.name }} --all-features --all-targets

      - name: Run ConformU test
        shell: bash
        timeout-minutes: 30
        run: |
          echo "::group::ConformU: ${{ matrix.service.name }}"
          ${{ matrix.service.command }}
          echo "::endgroup::"

  notify-on-failure:
    # Open or update a tracking issue when the nightly run fails so
    # conformance regressions surface without depending on someone
    # reading scheduled-workflow logs. Skipped on workflow_dispatch
    # so manual debugging runs do not churn the issue.
    needs: [conformu, conformu-windows]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      # The action and the helpers it imports, nothing else.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/actions/tracking-issue
            .github/actions/lib
      - name: Open or update tracking issue
        uses: ./.github/actions/tracking-issue
        with:
          title: "nightly: ConformU conformance suite failing"
          label: conformu-nightly
          body: |
            The nightly ConformU workflow failed on at least one OS or service.

            Likely causes: a recent change broke an ASCOM Alpaca contract on a
            service that opts in via `[package.metadata.conformu]`, a ConformU
            release tightened a check, or a hosted-runner environmental drift
            is producing a flake. Inspect the failed jobs in the linked run for
            the per-service ConformU report.
