# rules_rust's coverage patches: still applied, and still effective.
#
# MODULE.bazel's single_version_override carries two patches to rules_rust
# that `bazel coverage` depends on (.bazelrc's coverage section says what
# each does). A patch that no longer applies fails every Bazel command; the
# steps below catch a rules_rust bump after which a patch still applies but
# no longer does its job, which no test would notice. Runs on push to main,
# nightly and on dispatch.
permissions:
  contents: read
on:
  push:
    branches: [main]
  schedule:
    - cron: "45 6 * * *"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
name: rules_rust patches
jobs:
  rules-rust-patches:
    runs-on: ubuntu-latest
    name: rules_rust coverage patches
    steps:
      - uses: actions/checkout@v7
      - name: Setup bazelisk
        uses: bazelbuild/setup-bazelisk@v3
        with:
          bazelisk-version: 1.28.1
      # Each patch's work, looked for in rules_rust's fetched source (the
      # action's patches.mjs). The bazel-coverage job, which compiles and runs
      # the patched collector on every PR, is the behavioural backstop.
      - name: Guard - rules_rust coverage patches applied & effective
        uses: ./.github/actions/rules-rust-patches
