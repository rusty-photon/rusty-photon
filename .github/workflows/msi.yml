# Windows suite MSI — build + lifecycle verify (windows-packaging W4/W5).
#
# Runs `cargo ci build-msi` (SDK staging, CRT-static release build, wix
# build) and `cargo ci verify-msi` (silent install -> per-service-class
# checks -> failure-actions proofs -> feature remove -> uninstall) on
# windows-latest. Triggers: PRs that touch the packaging inputs (the
# iteration loop): the installer, the two tools and what they share, and
# install-zwo-sdk's module, whose links the build downloads ZWO's SDKs
# from; and workflow_dispatch for on-demand runs. release.yml runs the
# same two tools as the release gate, and the msi leg of
# nightly-packages.yml runs them nightly with the nightly version stamp
# (phase N3 of docs/plans/archive/nightly-releases.md) — the schedule lives
# there, not here.
permissions:
  contents: read
on:
  workflow_dispatch:
  pull_request:
    paths:
      - installer/**
      - tools/rusty-photon-ci/src/build_msi.rs
      - tools/rusty-photon-ci/src/verify_msi.rs
      - tools/rusty-photon-ci/src/packaging.rs
      - tools/rusty-photon-ci/src/packaging/**
      - tools/rusty-photon-ci/src/process.rs
      - .github/actions/install-zwo-sdk/zwo-sdk.mjs
      - .github/workflows/msi.yml
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
name: msi
jobs:
  build-verify:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Install stable
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-msi
      - name: Build the suite MSI
        run: cargo ci build-msi
      - name: Verify the MSI lifecycle
        run: cargo ci verify-msi
      - name: Upload the MSI
        uses: actions/upload-artifact@v7
        with:
          name: rusty-photon-msi
          path: dist/**/*.msi
          retention-days: 14
      - name: Stage failure logs
        if: failure()
        shell: pwsh
        # upload-artifact cannot span drive roots (workspace on D:, ProgramData
        # on C:), so collect everything into one workspace dir first.
        run: |
          New-Item -ItemType Directory -Force -Path failure-logs | Out-Null
          Copy-Item "$env:TEMP\rusty-photon-msi-install.log" failure-logs\ -ErrorAction SilentlyContinue
          Copy-Item "$env:TEMP\rusty-photon-msi-uninstall.log" failure-logs\ -ErrorAction SilentlyContinue
          Copy-Item "$env:ProgramData\rusty-photon\logs\*" failure-logs\ -ErrorAction SilentlyContinue
      - name: Upload install + service logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: msi-verify-logs
          path: failure-logs/
          if-no-files-found: ignore
          retention-days: 14

