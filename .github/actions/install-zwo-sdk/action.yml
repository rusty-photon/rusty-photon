name: Install ZWO ASI/EFW/EAF SDK
description: >-
  Install the MIT-licensed ZWO ASI camera, EFW filter-wheel and EAF focuser
  SDKs, with the libusb, libudev and libclang they need, so that the
  `zwo-camera` and `zwo-focuser` services link. libzwo-sys links the SDK even
  in a `--features simulation` build (it removes the hardware, not the link),
  see docs/services/zwo-camera.md / docs/services/zwo-focuser.md "Native
  dependency & build gating" and ADR-008. Linux and macOS take ZWO's prebuilt
  libraries as the INDI repository vendors them, at a pinned commit; Windows
  takes ZWO's developer SDKs from its CDN, whose links are rolling "latest"
  ones. The pin, the links and the install are zwo-sdk.mjs's; the download,
  the cache key and the fallback to an earlier week's download are
  lib/install.mjs's (plan item J5 in docs/plans/ci-shell-to-code.md). The
  downloads are cached: the INDI mirror rate-limits CI's ephemeral IPs (429s,
  issue #476), and on Windows the cache keeps a week's download, ZWO's CDN
  dropping connections often enough that a failed weekly refresh falls back
  to the newest earlier week's.

inputs:
  sudo:
    description: >-
      Whether the Linux path may use sudo (default "true"). The default
      apt-installs the libusb/libudev/clang prerequisites and installs the SDK
      into /usr/local, refreshing the loader's cache, as GitHub-hosted runners
      allow. Set "false" for the sudo-LESS self-hosted Pi nightly runner: the
      SDK goes under $RUNNER_TEMP/zwo-sdk, uncached, `-lusb-1.0`/`-ludev`
      resolve to links there to the system *runtime* libs (no -dev package),
      and ZWO_SDK_LIB_DIR + LD_LIBRARY_PATH are exported instead of touching
      /usr/local. In sudo-free mode the host must already provide
      clang/libclang (bindgen) and the libusb-1.0 runtime, both installed once
      at runner setup by scripts/setup-pi-runner.sh. Mirrors the QHYCCD
      per-run sudo-free model.
    default: "true"

runs:
  using: composite
  steps:
    - name: Install libusb + clang (Linux)
      if: runner.os == 'Linux' && inputs.sudo == 'true'
      shell: bash
      run: |
        sudo apt-get update -qq
        # libusb-1.0-0-dev: the SDK links `-lusb-1.0`.
        # libudev-dev: libEFWFilter is USB-HID and libzwo-sys links `-ludev` on
        #   Linux; without the -dev package the unversioned libudev.so symlink is
        #   missing and linking fails with "unable to find library -ludev".
        # clang/libclang-dev: bindgen (in libzwo-sys' build script) needs libclang.
        sudo apt-get install -y --no-install-recommends \
          libusb-1.0-0-dev \
          libudev-dev \
          clang \
          libclang-dev

    - name: Install libusb + llvm (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        brew install libusb llvm
        # bindgen needs libclang; surface Homebrew's llvm to subsequent steps.
        echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"

    - name: Resolve the ZWO SDK files
      id: resolve
      uses: ./.github/actions/install-zwo-sdk/resolve

    # Restore and save are separate steps, so that only a new download is
    # saved: re-saving an earlier week's download under this week's key would
    # stop the weekly refresh from trying ZWO's CDN again. The sudo-free path
    # stages per run, uncached.
    - name: Restore the ZWO SDK downloads
      if: runner.os != 'Linux' || inputs.sudo == 'true'
      id: cache
      uses: actions/cache/restore@v6
      with:
        path: zwo-sdk
        key: ${{ steps.resolve.outputs.key }}
        restore-keys: ${{ steps.resolve.outputs.restore-key }}

    - name: Install the ZWO SDK
      id: install
      uses: ./.github/actions/install-zwo-sdk/install
      with:
        sudo: ${{ inputs.sudo }}
        cache-hit: ${{ steps.cache.outputs.cache-hit }}
        cache-matched-key: ${{ steps.cache.outputs.cache-matched-key }}

    # Concurrent jobs racing to save the same key produce a non-fatal "cache
    # already exists" warning.
    - name: Save the ZWO SDK downloads
      if: steps.install.outputs.downloaded == 'true'
      uses: actions/cache/save@v6
      with:
        path: zwo-sdk
        key: ${{ steps.resolve.outputs.key }}
