name: Tracking issue
description: >-
  Opens a scheduled workflow's tracking issue, or comments on it while it
  stays open: the open issue labelled `label` and titled exactly `title`.
  A new issue carries `label` and ci-flake, and its body is `body`, the run's
  link and a note on how the issue works. Call it from a job that runs only
  when a scheduled run failed. Given `job`, it files only if that job of this
  run attempt failed, for a notifier that needs a whole matrix but watches
  one leg; it needs `actions: read` then. Plan item J7 in
  docs/plans/archive/ci-shell-to-code.md.
inputs:
  title:
    description: >-
      The issue's exact title. Others find the issue by it, so keep it
      unchanged.
    required: true
  label:
    description: The workflow's own label, which finds the issue and goes on a new one.
    required: true
  body:
    description: What failed and what to suspect, for a new issue's body.
    required: true
  job:
    description: >-
      A job of this run, by its exact name as the run shows it (such as
      `bazel / macos-latest`). When set, the action files only if that job
      concluded failure, cancelled or timed_out, and otherwise says why and
      succeeds. A name this run attempt has no job by fails the step, so a
      renamed job cannot quietly turn the issue off.
    required: false
    default: ''
  token:
    description: A token that can read and write the repository's issues, and with `job` read its runs.
    required: false
    default: ${{ github.token }}
outputs:
  number:
    description: The issue's number, or empty when `job` did not fail.
runs:
  using: node24
  main: index.mjs
