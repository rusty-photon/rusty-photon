name: Run the BDD suites as parallel shards
description: >
  Run the workspace BDD suites as concurrent processes rather than as one
  sequential `cargo test --workspace --test bdd`.

  cargo runs test binaries one after another, and cucumber serializes every
  scenario in a `@serial`-tagged feature — 41 of rp's 53 features carry the tag
  at feature level, so rp's suite spends ~97% of its wall clock with a single
  scenario in flight. The lever is processes: every BDD process spawns its own
  OmniSim (`--multi-instance`, a dynamic port, a per-instance settings dir), so
  they run independently, and `bdd_infra::sharding` partitions scenarios off plain
  `TEST_SHARD_INDEX` / `TEST_TOTAL_SHARDS`. Those are Bazel's variable names,
  but nothing about the mechanism is Bazel-specific. `@serial` still holds
  within a shard, which is the scope it protects — one process's simulator.

  Only suites that route their cucumber filter through `scenario_in_current_shard`
  can be sharded (today: rp, session-runner, polar-align). Every other suite
  ignores the vars and would run IN FULL in every shard, so the shard env is
  never set process-wide — only on the streams that can honour it.

inputs:
  rp-shards:
    description: >
      Shard processes for rp's suite, which is half the BDD wall clock by itself.
    required: false
    default: "4"
  session-runner-shards:
    description: Shard processes for session-runner's suite.
    required: false
    default: "2"
  rustflags:
    description: >
      RUSTFLAGS for the build and the suite processes. Passed as an input
      rather than inherited: a composite action's steps do not reliably see
      `env:` set on the `uses:` step that calls them.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: cargo test --test bdd (sharded)
      shell: bash
      env:
        RP_SHARDS: ${{ inputs.rp-shards }}
        SESSION_RUNNER_SHARDS: ${{ inputs.session-runner-shards }}
        BDD_RUSTFLAGS: ${{ inputs.rustflags }}
      run: |
        set -uo pipefail

        if [ -n "${BDD_RUSTFLAGS:-}" ]; then
          export RUSTFLAGS="$BDD_RUSTFLAGS"
        fi

        # Guarded rather than assumed: without it the artifact filter below
        # yields an empty manifest, which would surface as "no bdd test
        # binaries found" and send the reader looking at the build instead.
        command -v jq >/dev/null 2>&1 || {
          echo "::error::jq is required to read cargo's artifact messages"
          exit 1
        }

        # RUNNER_TEMP is a native path, so on Windows it arrives with
        # backslashes; normalise here as for the cargo paths below.
        tmp="${RUNNER_TEMP:-/tmp}"
        tmp="${tmp//\\//}"
        manifest="$tmp/bdd-binaries.tsv"
        build_log="$tmp/bdd-build.json"
        logs="$tmp/bdd-shard-logs"
        mkdir -p "$logs"

        # Build every bdd target once, then run the binaries directly.
        #
        # Re-invoking `cargo test -p <pkg>` per stream would be the obvious
        # shape and is a trap twice over: a single package's `--all-features`
        # resolves to a different feature unification than the workspace's, so
        # every stream rebuilds dozens of crates into separate artifacts; and
        # cargo holds an exclusive lock on the build directory while it does,
        # so the streams serialize on each other ("Blocking waiting for file
        # lock on build directory") — serializing the very thing this
        # parallelizes. Running the built binaries needs no cargo process at
        # all. `bdd_main!` honours BDD_PACKAGE_DIR for the chdir that cargo
        # would otherwise do, which is what makes direct invocation work.
        #
        # `--message-format=json` puts compiler diagnostics on stdout too, so a
        # failed build must be rendered explicitly or it surfaces as raw JSON.
        if ! cargo test --locked --workspace --all-features --test bdd \
             --no-run --message-format=json > "$build_log"; then
          echo "::error::bdd build failed"
          jq -r 'select(.reason == "compiler-message") | .message.rendered // empty' \
            "$build_log" || cat "$build_log"
          exit 1
        fi

        # Windows paths are normalised to forward slashes: bash can exec them,
        # and Rust's set_current_dir accepts them.
        jq -r 'select(.reason == "compiler-artifact"
                      and .executable != null
                      and .target.name == "bdd")
               | [(.manifest_path | sub("[\\\\/]Cargo\\.toml$"; "") | gsub("\\\\"; "/")),
                  (.executable | gsub("\\\\"; "/"))]
               | @tsv' "$build_log" > "$manifest"

        test -s "$manifest" || { echo "::error::no bdd test binaries found"; exit 1; }
        echo "built $(wc -l < "$manifest") bdd binaries"

        pids=()
        names=()

        # lookup <package-name> -> "<package-dir>\t<executable>"
        lookup() {
          awk -F'\t' -v want="$1" \
            '{ n = $1; sub(/.*\//, "", n); if (n == want) { print; exit } }' "$manifest"
        }

        # start <log-name> <package-dir> <executable> [shard-index shard-total]
        start() {
          local name=$1 dir=$2 exe=$3 idx=${4:-} total=${5:-}
          (
            export BDD_PACKAGE_DIR="$dir"
            if [ -n "$total" ]; then
              export TEST_SHARD_INDEX="$idx" TEST_TOTAL_SHARDS="$total"
            fi
            # </dev/null: a suite that reads stdin must not drain the caller's.
            "$exe" </dev/null
          ) >"$logs/$name.log" 2>&1 &
          pids+=("$!")
          names+=("$name")
        }

        shard_suite() {  # shard_suite <package> <count>
          local pkg=$1 count=$2 dir exe i
          IFS=$'\t' read -r dir exe < <(lookup "$pkg")
          if [ -z "${dir:-}" ]; then
            echo "::error::no bdd binary for $pkg"
            exit 1
          fi
          if [ "$count" -le 1 ]; then
            start "$pkg" "$dir" "$exe"
            return
          fi
          for ((i = 0; i < count; i++)); do
            start "$pkg-$i" "$dir" "$exe" "$i" "$count"
          done
        }

        shard_suite rp "$RP_SHARDS"
        shard_suite session-runner "$SESSION_RUNNER_SHARDS"

        # polar-align is shard-aware but small; filemonitor is the largest suite
        # that is not shard-aware. Together they are about one rp shard's work.
        # Everything else is 21 suites totalling ~5 min, run in one stream.
        #
        # Split into manifest files rather than bash arrays-by-reference: the
        # macOS runner's /bin/bash is 3.2, which has no namerefs.
        awk -F'\t' '{ n = $1; sub(/.*\//, "", n);
                      if (n == "polar-align" || n == "filemonitor") print }' \
          "$manifest" > "$tmp/bdd-heavy.tsv"
        awk -F'\t' '{ n = $1; sub(/.*\//, "", n);
                      if (n != "rp" && n != "session-runner" &&
                          n != "polar-align" && n != "filemonitor") print }' \
          "$manifest" > "$tmp/bdd-rest.tsv"

        # run_manifest <log-name> <tsv> — every suite it lists, in sequence.
        #
        # The list is read on fd 3 and each suite gets </dev/null, so a suite
        # that reads stdin cannot swallow the entries queued behind it. Sharing
        # stdin with the loop silently truncated this list, and because the
        # dropped suites never ran, nothing failed and the stream stayed green —
        # so the count is checked too: a short run is an error, not a pass.
        run_manifest() {
          local name=$1 file=$2
          (
            rc=0
            ran=0
            expected=$(wc -l < "$file" | tr -d '[:space:]')
            while IFS=$'\t' read -r dir exe <&3; do
              BDD_PACKAGE_DIR="$dir" "$exe" </dev/null || rc=1
              ran=$((ran + 1))
            done 3< "$file"
            if [ "$ran" -ne "$expected" ]; then
              echo "::error::stream $name ran $ran of $expected suites"
              rc=1
            fi
            exit "$rc"
          ) >"$logs/$name.log" 2>&1 &
          pids+=("$!")
          names+=("$name")
        }

        run_manifest heavy "$tmp/bdd-heavy.tsv"
        run_manifest rest "$tmp/bdd-rest.tsv"

        status=0
        for i in "${!pids[@]}"; do
          if ! wait "${pids[$i]}"; then
            echo "::error::BDD stream ${names[$i]} failed"
            status=1
          fi
        done

        # The streams interleave on stderr, so each buffers to its own file and
        # is replayed here under a collapsible group.
        for name in "${names[@]}"; do
          echo "::group::bdd ${name}"
          cat "$logs/${name}.log"
          echo "::endgroup::"
        done

        exit "$status"
