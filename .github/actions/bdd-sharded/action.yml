name: Run the BDD suites as parallel shards
description: >-
  Runs the workspace's BDD suites as processes at once, rather than as one
  `cargo test --workspace --test bdd`, which runs them one after another. It
  builds every bdd target once, then runs rp and session-runner each as shard
  processes, and the other suites in two more streams. Each stream's output
  is printed as a log group of its own once the streams end, a cancelled or
  timed-out run included. The logic is bdd.mjs's (plan item J12 in
  docs/plans/ci-shell-to-code.md; why it shards, docs/skills/testing.md §5.5).

inputs:
  rp-shards:
    description: >-
      Shard processes for rp's suite, which is half the BDD wall clock by
      itself.
    required: false
    default: "4"
  session-runner-shards:
    description: Shard processes for session-runner's suite.
    required: false
    default: "2"
  rustflags:
    description: >-
      RUSTFLAGS for the build and the suites. Empty leaves the job's own.
    required: false
    default: ""

runs:
  using: node24
  main: index.mjs
