name: Read an ASTAP pin
description: >-
  The SHA-256 install-astap's table (assets.json) pins for one runner's CLI
  archive, for refresh-astap-shas.yml to compare with what SourceForge serves.
  Fails when the table names another archive for that runner than the
  workflow downloads.
inputs:
  runner:
    description: The runner, as the table keys it, RUNNER_OS-RUNNER_ARCH (Linux-X64).
    required: true
  archive:
    description: The archive the workflow downloads for that runner, which the table must name.
    required: true
outputs:
  sha:
    description: The pinned SHA-256.
runs:
  using: node24
  main: index.mjs
