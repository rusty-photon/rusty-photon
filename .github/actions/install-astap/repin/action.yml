name: Write new ASTAP pins
description: >-
  Writes the new SHA-256 of each archive refresh-astap-shas.yml found rotated
  into install-astap's table (assets.json), changing those pins and nothing
  else.
inputs:
  results:
    description: The directory download-artifact put the refresh results in, one directory per artifact.
    required: true
runs:
  using: node24
  main: index.mjs
