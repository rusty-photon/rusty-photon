name: Install Pebble
description: >-
  Download Pebble (Let's Encrypt's ACME test server) and its
  pebble-challtestsrv DNS sidecar for doctor's end-to-end ACME BDD scenarios
  (docs/skills/testing.md §5.6), and export PEBBLE_PATH and
  PEBBLE_CHALLTESTSRV_PATH. The release, its asset table and their SHA-256 pins
  are in pebble.mjs; the download, check and unpack are lib/install.mjs's (plan
  item J3 in docs/plans/ci-shell-to-code.md).

runs:
  using: composite
  steps:
    - name: Resolve the Pebble assets
      id: resolve
      uses: ./.github/actions/install-pebble/resolve

    - name: Cache Pebble binaries
      id: cache
      uses: actions/cache@v5
      with:
        path: pebble
        key: ${{ steps.resolve.outputs.key }}

    # Absolute paths, consumed by doctor's BDD harness via Bazel's
    # `--test_env=PEBBLE_PATH` / `--test_env=PEBBLE_CHALLTESTSRV_PATH`
    # forwards in .bazelrc — pinned paths rather than a PATH entry, for
    # the same cache-key stability reasons as OMNISIM_PATH.
    - name: Install Pebble
      uses: ./.github/actions/install-pebble/install
      with:
        cache-hit: ${{ steps.cache.outputs.cache-hit }}
