name: Install SVBony Camera SDK
description: >-
  Install the SVBony camera SDK (libSVBCameraSDK, no license grant, ADR-018)
  and the libusb-1.0 it needs, so that the `svbony-camera` service links.
  libsvbony-sys links the SDK even in a `--features simulation` build (it
  removes the camera, not the link); SVBONY_SKIP_NATIVE_LINK=1 is the only way
  to leave the link out, see docs/services/svbony-camera.md "Native dependency
  & build gating". Linux and macOS (Intel only: there is no build for Apple
  Silicon) take SVBony's prebuilt library as the INDI repository vendors it,
  at a pinned commit; Windows takes SVBony's own SDK from the project's
  private mirror, against a pinned SHA-256 (ADR-018 §7). The pins, the files
  and the install are svbony-sdk.mjs's; the download and the cache key are
  lib/install.mjs's (plan item J6 in docs/plans/ci-shell-to-code.md).

inputs:
  sudo:
    description: >-
      Whether the Linux path may use sudo (default "true"). The default
      apt-installs libusb-1.0's -dev package and installs the SDK into
      /usr/local, refreshing the loader's cache, as GitHub-hosted runners
      allow. Set "false" for the sudo-LESS self-hosted Pi nightly runner: the
      SDK goes under $RUNNER_TEMP/svbony-sdk, uncached, `-lusb-1.0` resolves
      to a link there to the system *runtime* lib (no -dev package), and
      SVBONY_SDK_LIB_DIR + LD_LIBRARY_PATH are exported instead of touching
      /usr/local. In sudo-free mode the host must already have the libusb-1.0
      runtime, installed once at runner setup by scripts/setup-pi-runner.sh.
      Mirrors the ZWO and QHYCCD per-run sudo-free model.
    default: "true"
  windows-mirror-token:
    description: >-
      Bearer token for the private CI mirror (the PRIVATE_MIRROR_TOKEN
      GitHub Actions secret). Required on Windows, where the step fails
      without it; unused on Linux and macOS. Fork PRs and dependabot runs
      receive no repository secrets, so a caller that can build without the
      real link gates the step on the secret and sets
      SVBONY_SKIP_NATIVE_LINK=1 instead (see conformu.yml's Windows job).
    default: ""

runs:
  using: composite
  steps:
    - name: Install libusb (Linux)
      if: runner.os == 'Linux' && inputs.sudo == 'true'
      shell: bash
      run: |
        sudo apt-get update -qq
        # libusb-1.0-0-dev: the SDK's undefined libusb_* symbols are resolved
        # at run time by the consuming binary's own -lusb-1.0 link, so
        # libusb-1.0 must be there wherever libsvbony-sys links. No libclang
        # (no bindgen) and no libudev-dev (the SDK references no udev_*
        # symbols), both unlike install-zwo-sdk.
        sudo apt-get install -y --no-install-recommends libusb-1.0-0-dev

    - name: Install libusb (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: brew install libusb

    - name: Resolve the SVBony SDK files
      id: resolve
      uses: ./.github/actions/install-svbony-sdk/resolve

    # The INDI downloads only: the Windows SDK goes into no cache, which a
    # fork's pull request could restore, since only the token may fetch it
    # (ADR-018 §7). The sudo-free path stages per run, uncached.
    - name: Cache the SVBony SDK downloads
      if: runner.os != 'Windows' && (runner.os != 'Linux' || inputs.sudo == 'true')
      id: cache
      uses: actions/cache@v6
      with:
        path: svbony-sdk
        key: ${{ steps.resolve.outputs.key }}

    - name: Install the SVBony SDK
      uses: ./.github/actions/install-svbony-sdk/install
      with:
        sudo: ${{ inputs.sudo }}
        windows-mirror-token: ${{ inputs.windows-mirror-token }}
        cache-hit: ${{ steps.cache.outputs.cache-hit }}
