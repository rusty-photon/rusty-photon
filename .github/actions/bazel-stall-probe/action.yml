name: Bazel, watched for a stall
description: >-
  Runs one Bazel command, as a `run:` step would, and copies its output to
  the step's log. When the command prints nothing for silence-seconds, it
  dumps what the macOS wedge leaves to read: the Bazel server's threads and
  logs, the TCP connections to the remote cache and between the Bazel
  client and its server, whether ENOBUFS came first, and on macOS the
  client's stacks, the kernel's network buffers and memory, and, from a
  trace started before the build, each change to the connection between
  the client and its server and the packets that crossed it.
  It dumps again at each further silence-seconds of silence, at most three
  times, and retries and stops nothing: the step's timeout ends a wedged
  build. The step fails when Bazel does. The logic is probe.mjs's.

inputs:
  args:
    description: Bazel's arguments, separated by whitespace, such as `build --config=ci //...`.
    required: true
  silence-seconds:
    description: How long the command may print nothing before a dump. Bazel prints its progress every few seconds while a build moves.
    default: "300"

runs:
  using: node24
  main: index.mjs
