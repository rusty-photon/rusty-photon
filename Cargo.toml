resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Igor von Nyssen <igor@vonnyssen.com>"]
license = "MIT OR Apache-2.0"
rust-version = "1.99.0"
repository = "https://github.com/ivonnyssen/rusty_photon"
description = "Rusty Photon - An astrophotography application"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }

# Panic-free production code: deny the routes by which an otherwise-recoverable
# situation aborts the process instead. A driver that panics at 2am ends the
# night's imaging (docs/workspace.md § Project Tenets, tenet 2). Test code is
# exempt where the panic is the point, through `clippy.toml` and the carriers
# below (docs/workspace.md § Lints).
#
# The test-scope allow list for the pedantic and nursery groups: the lints whose
# test-side findings are inherent to test-code shape rather than fixable
# defects. One list, verbatim in every crate root's `#![cfg_attr(test,
# allow(...))]` and every `tests/` entry file's `#![allow(...)]`:
#
#   needless_pass_by_ref_mut, needless_pass_by_value, unused_async,
#   unused_async_trait_impl,
#   used_underscore_binding          — cucumber/mock signature shapes
#   significant_drop_tightening, significant_drop_in_scrutinee
#                                    — deliberate test lock choreography
#   cast_possible_truncation, cast_sign_loss, cast_precision_loss,
#   cast_possible_wrap, suboptimal_flops
#                                    — fixture math; expected values stay in
#                                      ulp lockstep with the code under test
#   too_many_lines, option_if_let_else, match_same_arms, float_cmp,
#   similar_names, struct_excessive_bools
#                                    — judgment lints not worth churn in tests
#
# Everything else in pedantic/nursery stays enforced on test code. A toolchain
# bump that makes a new lint fire on these shapes either fixes the test code or
# grows this list — in every carrier at once, they are one list.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
unreachable = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
panic_in_result_fn = "deny"
unchecked_time_subtraction = "deny"
string_slice = "deny"
as_conversions = "deny"
arithmetic_side_effects = "deny"
indexing_slicing = "deny"
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }

[workspace.dependencies]
bdd-infra = { path = "crates/bdd-infra" }
tokio = { version = "1.52.3", features = ["full"] }
tokio-util = "0.7"
async-stream = "0.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
humantime = "2.3.0"
humantime-serde = "1.1.1"
hostname = "0.4"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
chrono-tz = "0.10"
clap = { version = "4.6.0", features = ["derive"] }
libc = "0.2"
regex = "1.12.4"
directories = "6"
async-trait = "0.1.89"
# `display` is a workspace-level feature so that `cargo build -p <member>`
# resolves it the way a whole-workspace build does (docs/workspace.md § Enum
# derives).
derive_more = { version = "2", features = ["debug", "display"] }
# The same minor as jsonschema's strum requirement: a bump ahead of it puts a
# second strum + strum_macros into the lock.
strum = { version = "0.28.0", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tokio-test = "0.4.5"
proptest = "1.11.0"
fitsrs = "0.4"
wcs = "0.4"
ndarray = "0.17"
ndarray-ndimage = "0.6.0"
rmpfit = "2.0"
thiserror = "2.0.18"
# A YAML 1.2 parser that keeps each node's line, for rusty-photon-ci's tests
# that read the workflows and .github/actionlint.yaml. Pinned exactly: its 0.x
# API still changes in minor releases (0.2.0 made a duplicate key an error).
saphyr = { version = "=0.3.3", default-features = false }
# saphyr's parser, whose events keep the tags saphyr drops; the same pin.
saphyr-parser = { version = "=0.3.3", default-features = false }
# A TOML reader, for rusty-photon-ci's rust-toolchain-sha256s, which reads Rust's
# channel manifests. Reading only: no `display`, which writes TOML.
toml = { version = "1.1.8", default-features = false, features = ["std", "serde", "parse"] }
# SHA-256, for rusty-photon-ci's brew-formulas, which stamps each Homebrew formula
# with its tarball's.
sha2 = "0.11.1"
base64 = "0.23.0"
mockall = "0.15.0"
scraper = "0.29"
parking_lot = "0.13.0"
# Single-file embedded stores: rp-targets (the imaging plan),
# calibrator-flats (flat timing per train and filter) and focus-model (each
# train's focus record and run history). Pinned to the 4.x
# file-format generation — a redb-major bump needs a one-time
# `Database::upgrade()` step, distinct from each store's own `schema_version`
# (docs/crates/rp-targets.md "Schema migration").
redb = "4"
if-addrs = "0.15"
tokio-serial = "5.4.5"
# 0.10.1, not 0.10: rand 0.10.0's feature table references `rand/getrandom` as a
# `dep:`-only dependency with no implicit feature, so a direct-minimal-versions
# build of the dual-homed simulation crates fails to resolve it.
rand = "0.10.1"
rayon = "1.10"
# `libqhyccd-sys` links the proprietary static `qhyccd` lib and `libusb-1.0`:
# docs/services/qhy-camera.md "Native dependency & build gating".
qhyccd-rs = { path = "crates/qhyccd-rs" }
# Our fork of RReverser/ascom-alpaca-rs, with two server-side fixes: `Connecting`
# counts in-flight operations, and the setup pages sit on the specification's
# paths. Drop the fork for upstream once both are merged there
# (docs/workspace.md "Build Notes").
ascom-alpaca = { git = "https://github.com/rusty-photon/ascom-alpaca-rs.git", branch = "feature/spec-setup-pages", default-features = false }
# default-features = false: the device SDKs link per feature, and each service
# enables only its own device (`camera` / `focuser`) so its binary links — and
# its package ships — only the SDK blob it talks to.
zwo-rs = { path = "crates/zwo-rs", default-features = false }
axum = "0.8"
tower = "0.5"
http = "1"
maud = "0.27"
reqwest = { version = "0.13.4", features = ["form", "json", "query"] }
rp-auth = { path = "crates/rp-auth" }
rp-mcp-client = { path = "crates/rp-mcp-client" }
rp-catalog = { path = "crates/rp-catalog" }
rp-ephemeris = { path = "crates/rp-ephemeris" }
rp-fits = { path = "crates/rp-fits" }
rp-focus-curve = { path = "crates/rp-focus-curve" }
rp-guider = { path = "crates/rp-guider" }
rp-plate-solver = { path = "crates/rp-plate-solver" }
rp-targets = { path = "crates/rp-targets" }
rp-vocabulary = { path = "crates/rp-vocabulary" }
rusty-photon-tls = { path = "crates/rusty-photon-tls" }
skywatcher-motor-protocol = { path = "crates/skywatcher-motor-protocol" }
erfars = "0.2"
tzf-rs = "2"
csv = "1"
argon2 = { version = "0.5", features = ["std"] }
blake2 = { version = "0.11", default-features = false }
subtle = "2"
zeroize = "1"
rpassword = "7"
rcgen = { version = "0.14", features = ["pem", "x509-parser"] }
instant-acme = { version = "0.8", features = ["hyper-rustls", "rcgen"] }
rustls = "0.23"
rustls-pemfile = "2"
tokio-rustls = "0.26"
socket2 = "0.6"
cucumber = "0.23.0"
tempfile = "3.27.0"
uuid = { version = "1", features = ["v4", "serde"] }
rmcp = { version = "3.0", default-features = false }
schemars = "1.0"
cargo-husky = { version = "1", default-features = false, features = [
  "precommit-hook",
  "user-hooks",
] }
rusty-photon-i18n = { path = "crates/rusty-photon-i18n" }
rusty-photon-i18n-derive = { path = "crates/rusty-photon-i18n-derive" }
rusty-photon-camera-core = { path = "crates/rusty-photon-camera-core" }
rusty-photon-config = { path = "crates/rusty-photon-config" }
rusty-photon-doctor-checks = { path = "crates/rusty-photon-doctor-checks" }
rusty-photon-process = { path = "crates/rusty-photon-process" }
rusty-photon-driver = { path = "crates/rusty-photon-driver" }
rusty-photon-rolling-stats = { path = "crates/rusty-photon-rolling-stats" }
rusty-photon-server-config = { path = "crates/rusty-photon-server-config" }
rusty-photon-service-lifecycle = { path = "crates/rusty-photon-service-lifecycle" }
rusty-photon-setup = { path = "crates/rusty-photon-setup" }
rusty-photon-shared-transport = { path = "crates/rusty-photon-shared-transport" }
i18n-embed = { version = "0.16", features = ["fluent-system"] }
i18n-embed-fl = "0.10"
fluent-syntax = "0.12"
# `debug-embed` makes RustEmbed always bake the asset tree into the binary,
# even when `cfg(debug_assertions)` is on. Without it, dev/fastbuild builds
# read the asset directory from disk at runtime — fine under Cargo (the path
# stays the source tree) but broken under Bazel, whose CARGO_MANIFEST_DIR is
# a sandbox path that does not exist at runtime. We always want translations
# embedded, never lazy-loaded.
rust-embed = { version = "8.13.0", features = ["debug-embed"] }
# Pinned to 0.13 until the rest of the Fluent stack moves off `unic-langid`.
# 0.14.0 swapped `LanguageIdentifier` from `unic-langid` to `icu-locid`, but
# `i18n-embed` 0.16, `i18n-embed-fl` 0.10, and `fluent-bundle` 0.16 still
# require `fluent-langneg ^0.13` + `unic-langid ^0.9` on their public APIs.
# Bumping here would either duplicate `fluent-langneg` in the graph or force
# string-roundtrip conversions at every `negotiate_languages` call site.
# Revisit when https://github.com/kellpossible/cargo-i18n ships a release
# that requires `fluent-langneg ^0.14`.
fluent-langneg = "0.13"
sys-locale = "0.3"
unic-langid = { version = "0.9", features = ["macros"] }
syn = { version = "3", features = ["full"] }
quote = "1"
proc-macro2 = "1"

# Trim debug info to keep `target/` small and link fast. Workspace code keeps
# line tables so panic backtraces still resolve to file:line; deps get nothing
# (we don't step into tokio/serde). Override per-build with
# `RUSTFLAGS="-C debuginfo=2" cargo build` if you need full debug info.
[profile.dev]
debug = "line-tables-only"

# Dependencies are optimized even in dev builds; workspace code stays at
# opt-level 0. Deps compile once and stay cached, so an edit-rebuild costs the
# same, while their hot paths run at near-release speed: ascom-alpaca's
# per-pixel ImageBytes encoder serves a 26 MPix frame in ~0.2 s instead of
# ~2.8 s unoptimized — slow enough that zwo-camera's ConformU `ImageArray`
# read reaches ConformU's 10 s timeout on a loaded CI runner. A clean build
# costs ~16% more. `.bazelrc` applies the same to Bazel builds
# (`per_crate_rustc_flag`); keep the two in step.
[profile.dev.package."*"]
debug = false
opt-level = 1
