[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Igor von Nyssen <igor@vonnyssen.com>"]
license = "MIT OR Apache-2.0"
rust-version = "1.99.0"
repository = "https://github.com/ivonnyssen/rusty_photon"
description = "Rusty Photon - An astrophotography application"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }

# Panic-free production code: deny the routes by which an otherwise-recoverable
# situation aborts the process instead. A driver that panics at 2am ends the
# night's imaging (docs/workspace.md § Project Tenets, tenet 2).
#
# Test code is exempt where the panic is the point, but the exemption lives in
# `clippy.toml` at the repo root rather than in per-module attributes: it turns
# `unwrap_used`, `expect_used`, `panic` and `indexing_slicing` off in test scope
# only, so a `#[cfg(test)] mod tests { ... }` needs no `#[allow]` of its own.
#
# Three gaps still need a scoped attribute, and all are deliberate:
#   - `unreachable`, `string_slice`, `arithmetic_side_effects` and
#     `as_conversions` have no `clippy.toml` knob.
#   - Clippy treats `#[cfg(test)]` modules and `#[test]` functions as test code,
#     but not cucumber step definitions (`#[given]`/`#[when]`/`#[then]`), which
#     are plain functions in a test crate. `tests/bdd/` entry files therefore
#     keep a file-level `#![allow(...)]`; submodules pulled in via `#[path] mod`
#     inherit it.
#   - For the knobless lints in `#[cfg(test)]` mods inside `src/`, the crate
#     root carries `#![cfg_attr(test, allow(...))]`: active only in the
#     test-profile compilation, so every production line is still linted in the
#     non-test compilation of the same target. Feature-gated mock modules are
#     NOT exempt — they are ordinary lib code and held to production standard.
#
# The same two attribute carriers also hold the curated test-scope allow list
# for the pedantic/nursery rung: the lints whose test-side findings are
# inherent to test-code shape (cucumber step signatures, fixture math,
# exact-value asserts) rather than fixable defects (the census behind the
# list: docs/plans/archive/workspace-lints.md §L6b).
# One canonical list, verbatim in every crate root's `#![cfg_attr(test,
# allow(...))]` and every `tests/` entry file's `#![allow(...)]`:
#
#   needless_pass_by_ref_mut, needless_pass_by_value, unused_async,
#   unused_async_trait_impl,
#   used_underscore_binding          — cucumber/mock signature shapes
#   significant_drop_tightening, significant_drop_in_scrutinee
#                                    — deliberate test lock choreography
#   cast_possible_truncation, cast_sign_loss, cast_precision_loss,
#   cast_possible_wrap, suboptimal_flops
#                                    — fixture math; expected values stay in
#                                      ulp lockstep with the code under test
#   too_many_lines, option_if_let_else, match_same_arms, float_cmp,
#   similar_names, struct_excessive_bools
#                                    — judgment lints not worth churn in tests
#
# Everything else in pedantic/nursery stays enforced on test code. A toolchain
# bump that makes a new lint fire on these shapes either fixes the test code or
# grows this list — grow all carriers together, they are one list.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
unreachable = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
panic_in_result_fn = "deny"
unchecked_time_subtraction = "deny"
string_slice = "deny"
# The three costly ones are denied like the rest: every member, the dual-homed
# FFI crates included, inherits this table with `[lints] workspace = true`.
as_conversions = "deny"
arithmetic_side_effects = "deny"
indexing_slicing = "deny"
# The pedantic and nursery groups, denied across the workspace. priority -1
# keeps the per-lint entries above (and any future per-lint override) ranked
# over the group level. New stable toolchains add lints to both groups: the
# beta / clippy census is the ~6-week early warning, and toolchain-bump PRs
# absorb new sites — fix them, or grow the curated test-scope list above.
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }

[workspace.dependencies]
bdd-infra = { path = "crates/bdd-infra" }
tokio = { version = "1.52.3", features = ["full"] }
tokio-util = "0.7"
async-stream = "0.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
humantime = "2.3.0"
humantime-serde = "1.1.1"
hostname = "0.4"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
chrono-tz = "0.10"
clap = { version = "4.6.0", features = ["derive"] }
libc = "0.2"
regex = "1.12.4"
directories = "6"
async-trait = "0.1.89"
# `2.1` is not a floor the workspace needs: it uses only the `Debug` and
# `Display` derives, both of which exist in 2.0, and none of the dual-homed
# FFI crates (qhyccd-rs, zwo-rs, svbony-rs and their -sys shims) depends on
# derive_more at all.
#
# `display` is enabled here rather than per-member. A whole-workspace build
# unifies features and enables it anyway, so without this line a member that
# uses `derive_more::Display` without declaring `features = ["display"]` would
# compile everywhere except `cargo build -p <member>` — which only the nightly
# `cargo hack --feature-powerset` job runs. Enabling it workspace-wide costs no
# packages (`convert_case` + `unicode-segmentation` are proc-macro-only and
# already in the lock) and closes that green-PR/red-nightly gap.
derive_more = { version = "2.1", features = ["debug", "display"] }
# Variant iteration / count / discriminant-conversion derives (`VariantArray`,
# `EnumCount`, `FromRepr`), allocation-free `&'static str` variant constants,
# and the one `Display` case `derive_more` cannot cover: a string that must
# round-trip back through `FromStr`, which `Display` + `EnumString` pin to a
# single attribute. Plain `Display` is `derive_more`'s; see docs/workspace.md
# § Enum derives: which crate to reach for.
#
# Keep this pinned to the same minor `jsonschema` requires (it depends on strum
# with `features = ["derive"]`, so strum + strum_macros are already in the graph
# and this entry adds zero packages). Bumping ahead of jsonschema resolves a
# SECOND strum + strum_macros into Cargo.lock — a duplicate transitive version
# of the workspace's own making, on top of the ones docs/workspace.md
# § Duplicate transitive versions says it cannot collapse.
strum = { version = "0.28.0", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tokio-test = "0.4.5"
proptest = "1.11.0"
fitsrs = "0.4"
wcs = "0.4"
ndarray = "0.17"
ndarray-ndimage = "0.6.0"
rmpfit = "2.0"
thiserror = "2.0.18"
# A YAML 1.2 parser that keeps each node's line, for rusty-photon-ci's tests
# that read the workflows and .github/actionlint.yaml. Pinned exactly: its 0.x
# API still changes in minor releases (0.2.0 made a duplicate key an error).
saphyr = { version = "=0.3.3", default-features = false }
# saphyr's parser, whose events keep the tags saphyr drops; the same pin.
saphyr-parser = { version = "=0.3.3", default-features = false }
# A TOML reader, for rusty-photon-ci's rust-toolchain-sha256s, which reads Rust's
# channel manifests. Reading only: no `display`, which writes TOML.
toml = { version = "1.1.8", default-features = false, features = ["std", "serde", "parse"] }
# SHA-256, for rusty-photon-ci's brew-formulas, which stamps each Homebrew formula
# with its tarball's. The 0.11 release Cargo.lock already carries.
sha2 = "0.11.1"
base64 = "0.23.0"
mockall = "0.15.0"
# The Servo html5ever/selectors stack: CSS-selector assertions on rendered
# pages, in ui-htmx's suite and in bdd-infra's shared setup-page steps.
scraper = "0.29"
parking_lot = "0.13.0"
# Single-file embedded stores: rp-targets (the imaging plan),
# calibrator-flats (flat timing per train and filter) and focus-model (each
# train's focus record and run history). Pinned to the 4.x
# file-format generation — a redb-major bump needs a one-time
# `Database::upgrade()` step, distinct from each store's own `schema_version`
# (docs/crates/rp-targets.md "Schema migration").
redb = "4"
# Non-loopback interface enumeration for the MCP `Host` allowlist on a
# wildcard bind (rp's /mcp, calibrator-flats' and focus-model's derive it the
# same way).
if-addrs = "0.15"
tokio-serial = "5.4.5"
# Simulation-backend deps shared by the vendored, dual-homed camera crates
# (`rand` by `zwo-rs`, `qhyccd-rs` and `svbony-rs`; `rayon` by the first two),
# each behind its own `simulation` feature. Pinned once
# here so the shared version can't drift (Rule 10); the `optional` flag stays
# crate-local. `cargo publish` flattens the inherited version into a concrete one,
# so dual-home standalone releases are unaffected.
# Floor is 0.10.1, not 0.10: rand 0.10.0's feature table references `rand/getrandom`
# as a `dep:`-only dependency (no implicit feature), so a direct-minimal-versions
# build of the dual-homed sim crates fails to resolve it (fixed in 0.10.1).
rand = "0.10.1"
rayon = "1.10"
# QHYCCD camera SDK FFI. Vendored first-party at `crates/qhyccd-rs` (with its
# `libqhyccd-sys` sub-crate nested inside): the crate is authored by us, so we
# develop it in-tree and dual-home it to crates.io. `libqhyccd-sys`
# (transitively) links the proprietary static `qhyccd` lib + `libusb-1.0` — see
# `docs/services/qhy-camera.md` "Native dependency & build gating". Only
# `qhy-camera` depends on it today; declared at workspace level so the
# native-link policy rationale lives in one place.
qhyccd-rs = { path = "crates/qhyccd-rs" }
# Pinned to our fork for two server-side fixes, stacked on one branch.
# `Connecting`: upstream tracks in-flight Platform 7 `Connect` / `Disconnect`
# operations in a set keyed by device, so several outstanding at once collapse
# to one entry and the first to finish reports `Connecting == false` on behalf
# of the rest; a client that polls `Connecting` then reads a device whose
# connect handshake is still running — which is what ConformU's
# `alpacaprotocol` casing sweep does to qhy-camera (see
# `docs/services/qhy-camera.md` "Connect is asynchronous"). The fork counts
# the operations instead; that fix is offered upstream.
# The setup pages: upstream serves the device setup page at
# `/api/v1/{type}/{n}/setup`, a path no specification defines, and 404s the
# Management API's `/setup/v1/{type}/{n}/setup`; its setup hook sees no
# request, so no page can take a setting; and an unknown device number or
# method name answers 404 where the API Reference's examples give 400. The fork
# routes both specification paths for GET and POST through request-taking
# hooks (`Device::setup_request`, `Server::setup`), redirects upstream's path,
# and answers the statuses the specifications give; this fix is not offered
# upstream yet. Drop the fork and go back to upstream `main` once both are
# merged there; see `docs/workspace.md` "Build Notes".
ascom-alpaca = { git = "https://github.com/rusty-photon/ascom-alpaca-rs.git", branch = "feature/spec-setup-pages", default-features = false }
# ZWO ASI camera + EFW filter-wheel + EAF focuser FFI (safe wrapper over
# `libzwo-sys`), for the `zwo-camera` and `zwo-focuser` services. Vendored
# first-party + dual-homed at crates/zwo-rs: the monorepo is the canonical
# development home, edits are in-tree (no git-rev bump), and the crates.io
# releases for outside consumers come from the vendored subdir.
# default-features = false: the device SDKs link per feature, and each service
# enables only its own device (`camera` / `focuser`) so its binary links — and
# its package ships — only the SDK blob it talks to.
zwo-rs = { path = "crates/zwo-rs", default-features = false }
axum = "0.8"
tower = "0.5"
# The HTTP vocabulary (`Method`, `StatusCode`, `HeaderMap`) the setup pages
# speak without depending on a server framework.
http = "1"
# Compile-time HTML templates: the setup pages every service serves and the
# BFF's own pages. `ui-htmx` adds the `axum` feature for its responders.
maud = "0.27"
reqwest = { version = "0.13.4", features = ["form", "json", "query"] }
rp-auth = { path = "crates/rp-auth" }
rp-mcp-client = { path = "crates/rp-mcp-client" }
rp-catalog = { path = "crates/rp-catalog" }
rp-ephemeris = { path = "crates/rp-ephemeris" }
rp-fits = { path = "crates/rp-fits" }
rp-focus-curve = { path = "crates/rp-focus-curve" }
rp-guider = { path = "crates/rp-guider" }
rp-plate-solver = { path = "crates/rp-plate-solver" }
rp-targets = { path = "crates/rp-targets" }
rp-vocabulary = { path = "crates/rp-vocabulary" }
rusty-photon-tls = { path = "crates/rusty-photon-tls" }
skywatcher-motor-protocol = { path = "crates/skywatcher-motor-protocol" }
erfars = "0.2"
tzf-rs = "2"
csv = "1"
argon2 = { version = "0.5", features = ["std"] }
# rp-auth's verification memo. subtle and zeroize are already in the graph
# (through digest and rustls), so those two add edges, not crates. blake2 is
# not: argon2 0.5 brings blake2 0.10 on the digest 0.10 chain, this entry is
# blake2 0.11 on digest 0.11, and the lock carries both until argon2 moves to
# 0.6, which depends on blake2 ^0.11 and collapses the pair.
blake2 = { version = "0.11", default-features = false }
subtle = "2"
zeroize = "1"
rpassword = "7"
rcgen = { version = "0.14", features = ["pem", "x509-parser"] }
instant-acme = { version = "0.8", features = ["hyper-rustls", "rcgen"] }
rustls = "0.23"
rustls-pemfile = "2"
tokio-rustls = "0.26"
socket2 = "0.6"
cucumber = "0.23.0"
tempfile = "3.27.0"
uuid = { version = "1", features = ["v4", "serde"] }
rmcp = { version = "3.0", default-features = false }
schemars = "1.0"
cargo-husky = { version = "1", default-features = false, features = [
  "precommit-hook",
  "user-hooks",
] }
rusty-photon-i18n = { path = "crates/rusty-photon-i18n" }
rusty-photon-i18n-derive = { path = "crates/rusty-photon-i18n-derive" }
rusty-photon-camera-core = { path = "crates/rusty-photon-camera-core" }
rusty-photon-config = { path = "crates/rusty-photon-config" }
rusty-photon-doctor-checks = { path = "crates/rusty-photon-doctor-checks" }
rusty-photon-process = { path = "crates/rusty-photon-process" }
rusty-photon-driver = { path = "crates/rusty-photon-driver" }
rusty-photon-rolling-stats = { path = "crates/rusty-photon-rolling-stats" }
rusty-photon-server-config = { path = "crates/rusty-photon-server-config" }
rusty-photon-service-lifecycle = { path = "crates/rusty-photon-service-lifecycle" }
rusty-photon-setup = { path = "crates/rusty-photon-setup" }
rusty-photon-shared-transport = { path = "crates/rusty-photon-shared-transport" }
i18n-embed = { version = "0.16", features = ["fluent-system"] }
i18n-embed-fl = "0.10"
fluent-syntax = "0.12"
# `debug-embed` makes RustEmbed always bake the asset tree into the binary,
# even when `cfg(debug_assertions)` is on. Without it, dev/fastbuild builds
# read the asset directory from disk at runtime — fine under Cargo (the path
# stays the source tree) but broken under Bazel, whose CARGO_MANIFEST_DIR is
# a sandbox path that does not exist at runtime. We always want translations
# embedded, never lazy-loaded.
#
# The three Fluent services (ppba-driver, upbv2-driver, gemini-powerbox-adv3)
# depend on it directly, because the `fl!` macro reads the consumer crate's own
# manifest. The `=` holds nothing the lock does not: `rust-embed-impl` and
# `rust-embed-utils` are transitive and follow the lock, and the `digest 0.11`
# chain that `rust-embed-utils` brings in through `sha2` is in those services'
# graphs regardless, beside argon2's `digest 0.10` chain, through the
# workspace's own `sha2 0.11` and `blake2 0.11`.
rust-embed = { version = "=8.13.0", features = ["debug-embed"] }
# Pinned to 0.13 until the rest of the Fluent stack moves off `unic-langid`.
# 0.14.0 swapped `LanguageIdentifier` from `unic-langid` to `icu-locid`, but
# `i18n-embed` 0.16, `i18n-embed-fl` 0.10, and `fluent-bundle` 0.16 still
# require `fluent-langneg ^0.13` + `unic-langid ^0.9` on their public APIs.
# Bumping here would either duplicate `fluent-langneg` in the graph or force
# string-roundtrip conversions at every `negotiate_languages` call site.
# Revisit when https://github.com/kellpossible/cargo-i18n ships a release
# that requires `fluent-langneg ^0.14`.
fluent-langneg = "0.13"
sys-locale = "0.3"
unic-langid = { version = "0.9", features = ["macros"] }
syn = { version = "3", features = ["full"] }
quote = "1"
proc-macro2 = "1"

# Trim debug info to keep `target/` small and link fast. Workspace code keeps
# line tables so panic backtraces still resolve to file:line; deps get nothing
# (we don't step into tokio/serde). Override per-build with
# `RUSTFLAGS="-C debuginfo=2" cargo build` if you need full debug info.
[profile.dev]
debug = "line-tables-only"

# Dependencies are optimized even in dev builds; workspace code stays at
# opt-level 0. Deps compile once and stay cached, so an edit-rebuild costs the
# same, while their hot paths run at near-release speed: ascom-alpaca's
# per-pixel ImageBytes encoder serves a 26 MPix frame in ~0.2 s instead of
# ~2.8 s unoptimized — slow enough that zwo-camera's ConformU `ImageArray`
# read reaches ConformU's 10 s timeout on a loaded CI runner. A clean build
# costs ~16% more. `.bazelrc` applies the same to Bazel builds
# (`per_crate_rustc_flag`); keep the two in step.
[profile.dev.package."*"]
debug = false
opt-level = 1
