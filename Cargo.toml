resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Igor von Nyssen <igor@vonnyssen.com>"]
license = "MIT OR Apache-2.0"
rust-version = "1.94.1"
repository = "https://github.com/ivonnyssen/rusty_photon"
description = "Rusty Photon - An astrophotography application"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }

# Panic-free production code: deny the routes by which an otherwise-recoverable
# situation aborts the process instead. A driver that panics at 2am ends the
# night's imaging (docs/workspace.md § Project Tenets, tenet 2).
#
# Test code is exempt where the panic is the point, but the exemption lives in
# `clippy.toml` at the repo root rather than in per-module attributes: it turns
# `unwrap_used`, `expect_used`, `panic` and `indexing_slicing` off in test scope
# only, so a `#[cfg(test)] mod tests { ... }` needs no `#[allow]` of its own.
#
# Three gaps still need a scoped attribute, and all are deliberate:
#   - `unreachable`, `string_slice`, `arithmetic_side_effects` and
#     `as_conversions` have no `clippy.toml` knob.
#   - Clippy treats `#[cfg(test)]` modules and `#[test]` functions as test code,
#     but not cucumber step definitions (`#[given]`/`#[when]`/`#[then]`), which
#     are plain functions in a test crate. `tests/bdd/` entry files therefore
#     keep a file-level `#![allow(...)]`; submodules pulled in via `#[path] mod`
#     inherit it.
#   - For the knobless lints in `#[cfg(test)]` mods inside `src/`, the crate
#     root carries `#![cfg_attr(test, allow(...))]`: active only in the
#     test-profile compilation, so every production line is still linted in the
#     non-test compilation of the same target. Feature-gated mock modules are
#     NOT exempt — they are ordinary lib code and held to production standard.
#
# The same two attribute carriers also hold the curated test-scope allow list
# for the pedantic/nursery rung (docs/plans/workspace-lints.md §L6b): the lints
# whose test-side findings are inherent to test-code shape (cucumber step
# signatures, fixture math, exact-value asserts) rather than fixable defects.
# One canonical list, verbatim in every crate root's `#![cfg_attr(test,
# allow(...))]` and every `tests/` entry file's `#![allow(...)]`:
#
#   needless_pass_by_ref_mut, needless_pass_by_value, unused_async,
#   unused_async_trait_impl,
#   used_underscore_binding          — cucumber/mock signature shapes
#   significant_drop_tightening, significant_drop_in_scrutinee
#                                    — deliberate test lock choreography
#   cast_possible_truncation, cast_sign_loss, cast_precision_loss,
#   cast_possible_wrap, suboptimal_flops
#                                    — fixture math; expected values stay in
#                                      ulp lockstep with the code under test
#   too_many_lines, option_if_let_else, match_same_arms, float_cmp,
#   similar_names, struct_excessive_bools
#                                    — judgment lints not worth churn in tests
#
# Everything else in pedantic/nursery stays enforced on test code. A toolchain
# bump that makes a new lint fire on these shapes either fixes the test code or
# grows this list — grow all carriers together, they are one list.
#
# docs/plans/workspace-lints.md tracks the ladder that widens this set.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
unreachable = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
panic_in_result_fn = "deny"
unchecked_time_subtraction = "deny"
string_slice = "deny"
# The L5 ladder's three: zeroed rung by rung across every inheriting crate
# (docs/plans/workspace-lints.md §L5), flipped to deny 2026-08-14 after the
# full-workspace --all-targets --all-features census read zero outside the
# dual-homed FFI crates (then outside the [lints] mechanism; the L7 ladder
# now mirrors this table into them — see the dual-homed note below the table).
as_conversions = "deny"
arithmetic_side_effects = "deny"
indexing_slicing = "deny"
# The pedantic and nursery groups, zeroed slice by slice across the workspace
# (docs/plans/workspace-lints.md §L6b) and flipped to deny 2026-08-24 after a
# three-pass census (all-targets/all-features, lib/bins all-features, lib/bins
# default features) read zero in scope, plus a per-crate windows cross-clippy
# sweep and a hand audit of the remaining OS-cfg'd code. priority -1 keeps the
# per-lint entries above (and any future per-lint override) ranked over the
# group level. New stable toolchains add lints to both groups: the beta /
# clippy census is the ~6-week early warning, and toolchain-bump PRs absorb
# new sites — fix them, or grow the curated test-scope list above.
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
#
# Dual-homed FFI crates (qhyccd-rs, zwo-rs, svbony-rs and their -sys shims)
# cannot inherit this table: the nightly publish-readiness check builds each
# family copied out of the workspace, where `workspace = true` has nothing to
# resolve against. Each family instead adopts a concrete, verbatim copy of
# [workspace.lints.rust] + [workspace.lints.clippy] on its L7 rung
# (docs/plans/workspace-lints.md §L7; all three families — zwo, svbony and
# qhy — carry it today), and
# tools/ci/check_lints_parity.py — a step of the required `stable / clippy`
# gate — fails on any drift. Editing this table therefore means mirroring the
# edit into every copy in the same change.

[workspace.dependencies]
bdd-infra = { path = "crates/bdd-infra" }
tokio = { version = "1.52.3", features = ["full"] }
tokio-util = "0.7"
async-stream = "0.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
humantime = "2.3.0"
humantime-serde = "1.1.1"
hostname = "0.4"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
chrono-tz = "0.10"
clap = { version = "4.6.0", features = ["derive"] }
libc = "0.2"
regex = "1.12.4"
directories = "6"
async-trait = "0.1.89"
# 2.1 is the current minor, not a hard floor: the workspace uses only the
# `Debug` and `Display` derives, both of which exist in 2.0, and none of the
# dual-homed FFI crates (qhyccd-rs, zwo-rs, svbony-rs and their -sys shims)
# depends on derive_more at all — so publish-readiness's direct-minimal-versions
# build never exercises this requirement.
#
# `display` is enabled here rather than per-member. A whole-workspace build
# unifies features and enables it anyway, so a member that uses
# `derive_more::Display` without declaring `features = ["display"]` still
# compiles everywhere except `cargo build -p <member>` — which only the nightly
# `cargo hack --feature-powerset` job runs. Enabling it workspace-wide costs no
# packages (`convert_case` + `unicode-segmentation` are proc-macro-only and
# already in the lock) and removes that green-PR/red-nightly gap.
derive_more = { version = "2.1", features = ["debug", "display"] }
# Variant iteration / count / discriminant-conversion derives (`VariantArray`,
# `EnumCount`, `FromRepr`), allocation-free `&'static str` variant constants,
# and the one `Display` case `derive_more` cannot cover: a string that must
# round-trip back through `FromStr`, which `Display` + `EnumString` pin to a
# single attribute. Plain `Display` is `derive_more`'s; see docs/workspace.md
# § Enum derives: which crate to reach for.
#
# Keep this pinned to the same minor `jsonschema` requires (it depends on strum
# with `features = ["derive"]`, so strum + strum_macros are already in the graph
# and this entry adds zero packages). Bumping ahead of jsonschema resolves a
# SECOND strum + strum_macros into Cargo.lock — the duplicate-dependency debt
# PR #715 was cleaning up.
strum = { version = "0.28.0", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tokio-test = "0.4.5"
proptest = "1.11.0"
fitsrs = "0.4"
wcs = "0.4"
ndarray = "0.17"
ndarray-ndimage = "0.6.0"
rmpfit = "2.0"
thiserror = "2.0.18"
base64 = "0.23.0"
mockall = "0.15.0"
parking_lot = "0.12.5"
tokio-serial = "5.4.5"
# Simulation-backend deps shared by the two vendored, dual-homed camera crates
# (`zwo-rs` + `qhyccd-rs`), each behind its own `simulation` feature. Pinned once
# here so the shared version can't drift (Rule 10); the `optional` flag stays
# crate-local. `cargo publish` flattens the inherited version into a concrete one,
# so dual-home standalone releases are unaffected.
# Floor is 0.10.1, not 0.10: rand 0.10.0's feature table references `rand/getrandom`
# as a `dep:`-only dependency (no implicit feature), so a direct-minimal-versions
# build of the dual-homed sim crates fails to resolve it (fixed in 0.10.1; caught
# by the publish-readiness check).
rand = "0.10.1"
rayon = "1.10"
# QHYCCD camera SDK FFI. Vendored first-party at `crates/qhyccd-rs` (with its
# `libqhyccd-sys` sub-crate nested inside) per ADR-009 — the crate is authored by
# us, so we develop it in-tree and dual-home it to crates.io. `libqhyccd-sys`
# (transitively) links the proprietary static `qhyccd` lib + `libusb-1.0` — see
# `docs/services/qhy-camera.md` "Native dependency & build gating". Only
# `qhy-camera` depends on it today; declared at workspace level so the
# native-link policy rationale lives in one place.
qhyccd-rs = { path = "crates/qhyccd-rs" }
ascom-alpaca = { git = "https://github.com/RReverser/ascom-alpaca-rs.git", branch = "main", default-features = false }
# ZWO ASI camera + EFW filter-wheel + EAF focuser FFI (safe wrapper over
# `libzwo-sys`), for the `zwo-camera` and `zwo-focuser` services. Vendored
# first-party + dual-homed at crates/zwo-rs (ADR-010 /
# docs/plans/vendor-zwo-rs.md) — the monorepo is now the canonical development
# home; edits are in-tree (no git-rev bump). Still published to crates.io from
# the vendored subdir for outside consumers.
# default-features = false: the device SDKs link per feature (ADR-014), and
# each service enables only its own device (`camera` / `focuser`) so its binary
# links — and its package ships — only the SDK blob it talks to.
zwo-rs = { path = "crates/zwo-rs", default-features = false }
axum = "0.8"
tower = "0.5"
reqwest = { version = "0.13.4", features = ["form", "json"] }
rp-auth = { path = "crates/rp-auth" }
rp-mcp-client = { path = "crates/rp-mcp-client" }
rp-catalog = { path = "crates/rp-catalog" }
rp-ephemeris = { path = "crates/rp-ephemeris" }
rp-fits = { path = "crates/rp-fits" }
rp-guider = { path = "crates/rp-guider" }
rp-plate-solver = { path = "crates/rp-plate-solver" }
rp-targets = { path = "crates/rp-targets" }
rp-vocabulary = { path = "crates/rp-vocabulary" }
rusty-photon-tls = { path = "crates/rusty-photon-tls" }
skywatcher-motor-protocol = { path = "crates/skywatcher-motor-protocol" }
erfars = "0.2"
tzf-rs = "1"
csv = "1"
argon2 = { version = "0.5", features = ["std"] }
rpassword = "7"
rcgen = { version = "0.14", features = ["pem", "x509-parser"] }
instant-acme = { version = "0.8", features = ["hyper-rustls", "rcgen"] }
cloudflare = { version = "0.14", default-features = false, features = ["rustls-tls"] }
rustls = "0.23"
rustls-pemfile = "2"
tokio-rustls = "0.26"
socket2 = "0.6"
cucumber = "0.23.0"
tempfile = "3.27.0"
uuid = { version = "1", features = ["v4", "serde"] }
rmcp = { version = "3.0", default-features = false }
schemars = "1.0"
cargo-husky = { version = "1", default-features = false, features = [
  "precommit-hook",
  "user-hooks",
] }
rusty-photon-i18n = { path = "crates/rusty-photon-i18n" }
rusty-photon-i18n-derive = { path = "crates/rusty-photon-i18n-derive" }
rusty-photon-camera-core = { path = "crates/rusty-photon-camera-core" }
rusty-photon-config = { path = "crates/rusty-photon-config" }
rusty-photon-doctor-checks = { path = "crates/rusty-photon-doctor-checks" }
rusty-photon-driver = { path = "crates/rusty-photon-driver" }
rusty-photon-server-config = { path = "crates/rusty-photon-server-config" }
rusty-photon-service-lifecycle = { path = "crates/rusty-photon-service-lifecycle" }
rusty-photon-shared-transport = { path = "crates/rusty-photon-shared-transport" }
i18n-embed = { version = "0.16", features = ["fluent-system"] }
i18n-embed-fl = "0.10"
fluent-syntax = "0.12"
# `debug-embed` makes RustEmbed always bake the asset tree into the binary,
# even when `cfg(debug_assertions)` is on. Without it, dev/fastbuild builds
# read the asset directory from disk at runtime — fine under Cargo (the path
# stays the source tree) but broken under Bazel, whose CARGO_MANIFEST_DIR is
# a sandbox path that does not exist at runtime. We always want translations
# embedded, never lazy-loaded.
#
# Held at exactly 8.11.0: from 8.12 `rust-embed-utils` pulls in `sha2`/`digest
# 0.11`, landing next to the `digest 0.10` chain `argon2`/`blake2` already
# bring in. ppba-driver is the only service with a *direct* `rust-embed`
# dependency (the `fl!` macro reads the consumer crate's own manifest), so it is
# the only package whose graph gets that duplicate — and its two largest test
# targets then fail `rustc` E0463 "can't find crate" under
# `bazel / windows-latest`, deterministically. `rust-embed-impl` /
# `rust-embed-utils` are transitive, so this `=` cannot hold them; they are
# held in `Cargo.lock` instead — see "Holding a transitive dependency back" in
# docs/workspace.md. Revisit once `argon2`/`blake2` ship on `digest 0.11`.
rust-embed = { version = "=8.11.0", features = ["debug-embed"] }
# Pinned to 0.13 until the rest of the Fluent stack moves off `unic-langid`.
# 0.14.0 swapped `LanguageIdentifier` from `unic-langid` to `icu-locid`, but
# `i18n-embed` 0.16, `i18n-embed-fl` 0.10, and `fluent-bundle` 0.16 still
# require `fluent-langneg ^0.13` + `unic-langid ^0.9` on their public APIs.
# Bumping here would either duplicate `fluent-langneg` in the graph or force
# string-roundtrip conversions at every `negotiate_languages` call site.
# Revisit when https://github.com/kellpossible/cargo-i18n ships a release
# that requires `fluent-langneg ^0.14`.
fluent-langneg = "0.13"
sys-locale = "0.3"
unic-langid = { version = "0.9", features = ["macros"] }
syn = { version = "3", features = ["full"] }
quote = "1"
proc-macro2 = "1"

# Trim debug info to keep `target/` small and link fast. Workspace code keeps
# line tables so panic backtraces still resolve to file:line; deps get nothing
# (we don't step into tokio/serde). Override per-build with
# `RUSTFLAGS="-C debuginfo=2" cargo build` if you need full debug info.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
