[package]
name = "guider"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "The guider: keeps a mount on its target from the frames of an Alpaca Camera, with PulseGuide on an Alpaca Telescope, commanded by rp over HTTP"
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
# The guider is a client of one Camera and one Telescope, never a server of
# Alpaca devices (docs/services/guider.md § Overview).
ascom-alpaca = { workspace = true, features = ["client", "camera", "telescope"] }
axum = { workspace = true }
base64 = { workspace = true }
# The guide log's local times: its files' names, its lines and the noon that
# turns a night.
chrono = { workspace = true }
clap = { workspace = true }
humantime = { workspace = true }
# The setup page's note that a restart ends a guiding run.
maud = { workspace = true }
ndarray = { workspace = true }
num-traits = { workspace = true }
parking_lot = { workspace = true }
# `GET /api/v1/frame/latest` answers the latest frame as a PNG.
png = { workspace = true }
# The draws of dithers.
rand = { workspace = true }
reqwest = { workspace = true }
# A `ca_cert` that holds no certificate refuses the start (guider.md
# § Configuration validation at startup).
rustls-pemfile = { workspace = true }
# The configuration's schema, which the setup page renders.
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
# The running totals' and the metrics' epoch.
uuid = { workspace = true }
rp-auth = { workspace = true }
rp-guiding = { workspace = true }
rusty-photon-config = { workspace = true }
rusty-photon-doctor-checks = { workspace = true }
rusty-photon-rolling-stats = { workspace = true }
rusty-photon-server-config = { workspace = true }
rusty-photon-setup = { workspace = true }
rusty-photon-service-lifecycle = { workspace = true }
rusty-photon-tls = { workspace = true }

# Enable the Windows Service Control Manager dispatch only on Windows;
# on Unix the `scm` feature would pull in `windows-service` for no
# runtime benefit.
[target.'cfg(windows)'.dependencies]
rusty-photon-service-lifecycle = { workspace = true, features = ["scm"] }

[dev-dependencies]
# The unit tests' fake camera implements the Alpaca Camera trait.
async-trait = { workspace = true }
# setup-pages: the shared setup-page steps the guider's own `/setup`
# scenarios use.
bdd-infra = { workspace = true, features = ["tls-auth", "setup-pages"] }
cucumber = { workspace = true }
guide-simulator = { workspace = true }
guide-simulator-alpaca = { workspace = true }
tempfile = { workspace = true }
# test-util: unlocks paused tokio time (`start_paused`), so the call
# deadline's test waits out 10 s without taking them.
tokio = { workspace = true, features = ["test-util"] }
cargo-husky = { workspace = true }

[[test]]
name = "bdd"
harness = false

[package.metadata.deb]
name = "rusty-photon-guider"
maintainer = "Igor von Nyssen <igor@vonnyssen.com>"
extended-description = "The guider for Rusty Photon: keeps a mount on its target from the frames of an Alpaca Camera, with PulseGuide on an Alpaca Telescope, commanded by rp over HTTP. Headless; it links no vendor SDK."
section = "science"
priority = "optional"
# $auto = dpkg-shlibdeps (needs a Debian build host); adduser is used by postinst.
depends = "$auto, adduser"
assets = [
    ["target/release/guider", "usr/bin/rusty-photon-guider", "755"],
]
maintainer-scripts = "pkg/"

[package.metadata.deb.systemd-units]
unit-name = "rusty-photon-guider"
unit-scripts = "pkg/"
enable = true
start = true
restart-after-upgrade = true

[package.metadata.generate-rpm]
name = "rusty-photon-guider"
summary = "Guider for Rusty Photon: keeps a mount on its target with PulseGuide"
license = "MIT OR Apache-2.0"
assets = [
    { source = "target/release/guider", dest = "/usr/bin/rusty-photon-guider", mode = "755" },
    { source = "pkg/rusty-photon-guider.service", dest = "/usr/lib/systemd/system/rusty-photon-guider.service", mode = "644" },
]
post_install_script = """
getent passwd rusty-photon > /dev/null || useradd -r -d /var/lib/rusty-photon -s /sbin/nologin rusty-photon
install -d -m 0750 -o rusty-photon -g rusty-photon /var/lib/rusty-photon /var/lib/rusty-photon/.config /var/lib/rusty-photon/.config/rusty-photon
[ -e /etc/rusty-photon ] || ln -s /var/lib/rusty-photon/.config/rusty-photon /etc/rusty-photon
systemctl daemon-reload
if [ "$1" -eq 1 ]; then
    systemctl enable rusty-photon-guider.service
fi
"""
# rpm scriptlet arg $1 = package instances remaining after the operation.
# On upgrade the old %preun runs AFTER the new %post, so an unguarded
# stop/disable would take the service down right after every upgrade.
# Guarded: enable fires on first install only (upgrades keep the
# operator's enable/disable choice), stop/disable on final erase only,
# and try-restart hands a running service over to the upgraded binary
# (the deb restart-after-upgrade equivalent).
pre_uninstall_script = """
if [ "$1" -eq 0 ]; then
    systemctl stop rusty-photon-guider.service || true
    systemctl disable rusty-photon-guider.service || true
fi
"""
# rpm has no purge lifecycle: erase preserves the runtime-created config and
# state (removal is a documented manual step), matching dpkg remove-vs-purge.
post_uninstall_script = """
systemctl daemon-reload
if [ "$1" -ge 1 ]; then
    systemctl try-restart rusty-photon-guider.service || true
fi
"""
require-sh = true
