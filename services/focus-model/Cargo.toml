[package]
name = "focus-model"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Focus tool provider - sizes, predicts and runs V-curve focus sweeps per optical train through rp, remembering offsets, temperature and every run in a redb store"
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
humantime = { workspace = true }
humantime-serde = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
axum = { workspace = true }
async-trait = { workspace = true }
# The MCP *server* half: the focus tools rp aggregates (rp.md § Plugin-
# Provided Tools). The client half comes through rp-mcp-client (ADR-017).
rmcp = { workspace = true, features = ["server", "macros", "transport-streamable-http-server", "schemars"] }
schemars = { workspace = true }
# The request cancellation token rmcp hands a tool body (`RequestContext::ct`).
tokio-util = { workspace = true }
# The focus store (docs/services/focus-model.md § Store).
redb = { workspace = true }
# `at` / `updated_at` stamps.
chrono = { workspace = true }
# The MCP `Host` allowlist: hostname + interface addresses, as rp derives it.
hostname = { workspace = true }
if-addrs = { workspace = true }
rp-auth = { workspace = true }
rp-mcp-client = { workspace = true }
rusty-photon-tls = { workspace = true }
rusty-photon-config = { workspace = true }
rusty-photon-doctor-checks = { workspace = true }
rusty-photon-server-config = { workspace = true }
rusty-photon-service-lifecycle = { workspace = true }

# Enable the Windows Service Control Manager dispatch only on Windows;
# on Unix the `scm` feature would pull in `windows-service` for no
# runtime benefit.
[target.'cfg(windows)'.dependencies]
rusty-photon-service-lifecycle = { workspace = true, features = ["scm"] }

[package.metadata.deb]
name = "rusty-photon-focus-model"
maintainer = "Igor von Nyssen <igor@vonnyssen.com>"
extended-description = "Focus tool provider: focus_train / determine_filter_offsets / get_sweep_plan / get_focus_model / get_focus_runs / set_focus_offsets / reset_focus_model served through rp."
section = "science"
priority = "optional"
# $auto = dpkg-shlibdeps (needs a Debian build host); adduser is used by postinst.
depends = "$auto, adduser"
assets = [
    ["target/release/focus-model", "usr/bin/rusty-photon-focus-model", "755"],
]
maintainer-scripts = "pkg/"

[package.metadata.deb.systemd-units]
unit-name = "rusty-photon-focus-model"
unit-scripts = "pkg/"
enable = true
start = true
restart-after-upgrade = true

[package.metadata.generate-rpm]
name = "rusty-photon-focus-model"
summary = "Focus tool provider"
license = "MIT OR Apache-2.0"
assets = [
    { source = "target/release/focus-model", dest = "/usr/bin/rusty-photon-focus-model", mode = "755" },
    { source = "pkg/rusty-photon-focus-model.service", dest = "/usr/lib/systemd/system/rusty-photon-focus-model.service", mode = "644" },
]
post_install_script = """
getent passwd rusty-photon > /dev/null || useradd -r -d /var/lib/rusty-photon -s /sbin/nologin rusty-photon
install -d -m 0750 -o rusty-photon -g rusty-photon /var/lib/rusty-photon /var/lib/rusty-photon/.config /var/lib/rusty-photon/.config/rusty-photon
[ -e /etc/rusty-photon ] || ln -s /var/lib/rusty-photon/.config/rusty-photon /etc/rusty-photon
systemctl daemon-reload
if [ "$1" -eq 1 ]; then
    systemctl enable rusty-photon-focus-model.service
fi
"""
# rpm scriptlet arg $1 = package instances remaining after the operation.
# On upgrade the old %preun runs AFTER the new %post, so an unguarded
# stop/disable would take the service down right after every upgrade.
# Guarded: enable fires on first install only (upgrades keep the
# operator's enable/disable choice), stop/disable on final erase only,
# and try-restart hands a running service over to the upgraded binary
# (the deb restart-after-upgrade equivalent).
pre_uninstall_script = """
if [ "$1" -eq 0 ]; then
    systemctl stop rusty-photon-focus-model.service || true
    systemctl disable rusty-photon-focus-model.service || true
fi
"""
# rpm has no purge lifecycle: erase preserves the runtime-created config and
# state (removal is a documented manual step), matching dpkg remove-vs-purge.
post_uninstall_script = """
systemctl daemon-reload
if [ "$1" -ge 1 ]; then
    systemctl try-restart rusty-photon-focus-model.service || true
fi
"""
require-sh = true

[dev-dependencies]
bdd-infra = { workspace = true, features = ["rp-harness", "tls-auth"] }
cucumber = { workspace = true }
derive_more = { workspace = true }
libc = { workspace = true }
mockall = { workspace = true }
reqwest = { workspace = true }
tempfile = { workspace = true }
tokio-test = { workspace = true }
cargo-husky = { workspace = true }

[[test]]
name = "bdd"
harness = false
