[package]
name = "ui-htmx"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Server-rendered web UI (BFF) for rusty-photon — HTMX expression"

[lints]
workspace = true

[features]
# Test-only `/fixtures/*` routes for the @browser BDD layer. OFF by default, so
# the real binary ships none of them; the BDD suite spawns a binary built WITH it
# (cargo `--all-features`; Bazel `:ui-htmx_fixtures`). The fixtures module is
# `#[coverage(off)]`: test-only code does not count toward product coverage.
test-fixtures = []
# Test-only Server-Sent-Events fixture routes for the @browser `sse.feature`
# scenarios, the same shape as `test-fixtures`: OFF by default,
# `#[coverage(off)]`, spawned only by the BDD suite.
test-sse = []

[dependencies]
axum = { workspace = true }
derive_more = { workspace = true }
humantime = { workspace = true }
maud = { workspace = true, features = ["axum"] }
reqwest = { workspace = true }
# The config's JSON Schema, which the BFF's own setup page renders from.
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
# `CancellationToken`, which ends the open SSE proxy streams on shutdown.
tokio-util = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
clap = { workspace = true }
rp-auth = { workspace = true }
# The targets inbox drives rp's MCP-only target tools through the standard MCP
# client, one session per request (docs/services/ui-htmx.md § Targets inbox).
rp-mcp-client = { workspace = true }
rusty-photon-tls = { workspace = true }
rusty-photon-config = { workspace = true }
rusty-photon-doctor-checks = { workspace = true }
# The BFF's own setup page, and the host rule its link to rp's page follows.
rusty-photon-setup = { workspace = true }
rusty-photon-server-config = { workspace = true }
rusty-photon-service-lifecycle = { workspace = true }
# The production SSE proxy (`/stream/events`) builds its stream with it, as does
# the test-only SSE fixture endpoint, so it is not gated on `test-sse`.
async-stream = { workspace = true }

# Enable the Windows Service Control Manager dispatch only on Windows;
# on Unix the `scm` feature would pull in `windows-service` for no
# runtime benefit.
[target.'cfg(windows)'.dependencies]
rusty-photon-service-lifecycle = { workspace = true, features = ["scm"] }

[package.metadata.deb]
name = "rusty-photon-ui-htmx"
maintainer = "Igor von Nyssen <igor@vonnyssen.com>"
extended-description = "Server-rendered web UI for Rusty Photon: the activity stream and the targets inbox."
section = "science"
priority = "optional"
# $auto = dpkg-shlibdeps (needs a Debian build host); adduser is used by postinst.
depends = "$auto, adduser"
assets = [
    ["target/release/ui-htmx", "usr/bin/rusty-photon-ui-htmx", "755"],
]
maintainer-scripts = "pkg/"

[package.metadata.deb.systemd-units]
unit-name = "rusty-photon-ui-htmx"
unit-scripts = "pkg/"
enable = true
start = true
restart-after-upgrade = true

[package.metadata.generate-rpm]
name = "rusty-photon-ui-htmx"
summary = "Web UI for Rusty Photon: activity stream and targets inbox"
license = "MIT OR Apache-2.0"
assets = [
    { source = "target/release/ui-htmx", dest = "/usr/bin/rusty-photon-ui-htmx", mode = "755" },
    { source = "pkg/rusty-photon-ui-htmx.service", dest = "/usr/lib/systemd/system/rusty-photon-ui-htmx.service", mode = "644" },
]
post_install_script = """
getent passwd rusty-photon > /dev/null || useradd -r -d /var/lib/rusty-photon -s /sbin/nologin rusty-photon
install -d -m 0750 -o rusty-photon -g rusty-photon /var/lib/rusty-photon /var/lib/rusty-photon/.config /var/lib/rusty-photon/.config/rusty-photon
[ -e /etc/rusty-photon ] || ln -s /var/lib/rusty-photon/.config/rusty-photon /etc/rusty-photon
systemctl daemon-reload
if [ "$1" -eq 1 ]; then
    systemctl enable rusty-photon-ui-htmx.service
fi
"""
# rpm scriptlet arg $1 = package instances remaining after the operation.
# On upgrade the old %preun runs AFTER the new %post, so an unguarded
# stop/disable would take the service down right after every upgrade.
# Guarded: enable fires on first install only (upgrades keep the
# operator's enable/disable choice), stop/disable on final erase only,
# and try-restart hands a running service over to the upgraded binary
# (the deb restart-after-upgrade equivalent).
pre_uninstall_script = """
if [ "$1" -eq 0 ]; then
    systemctl stop rusty-photon-ui-htmx.service || true
    systemctl disable rusty-photon-ui-htmx.service || true
fi
"""
# rpm has no purge lifecycle: erase preserves the runtime-created config and
# state (removal is a documented manual step), matching dpkg remove-vs-purge.
post_uninstall_script = """
systemctl daemon-reload
if [ "$1" -ge 1 ]; then
    systemctl try-restart rusty-photon-ui-htmx.service || true
fi
"""
require-sh = true

[dev-dependencies]
# rp-harness: the suites spawn a real rp (RpConfigBuilder + launcher) beside
# the BFF — an all-first-party stack, no OmniSim.
# tls-auth: the shared PKI + credentials fixture backing the deep TLS + Basic
# Auth suites (auth.feature, tls.feature).
# setup-pages: the shared setup-page steps the BFF's own `/setup` scenarios use.
bdd-infra = { workspace = true, features = ["rp-harness", "tls-auth", "setup-pages"] }
mockall = { workspace = true }
# `ServiceExt::oneshot`, to drive the router in unit tests.
tower = { workspace = true, features = ["util"] }
cucumber = { workspace = true }
tempfile = { workspace = true }
# Layer A (docs/services/ui-htmx.md § Three obligations, three layers): the Servo
# html5ever/selectors stack browsers ship, for CSS-selector DOM assertions in the
# BDD suite.
scraper = { workspace = true }
# Layer B: byte-equivalence snapshots of the server's HTML output, the
# cross-OS-comparable artifact (P2). `filters` scrubs run/OS-varying tokens
# before compare.
insta = { version = "1.48", features = ["filters", "redactions"] }
# Layer C: a real WebDriver browser for behaviors only a browser can prove
# (P3 — htmx actually executes the swap/poll). Pure Rust, no Node. The @browser
# scenarios it drives are gated behind UI_BROWSER_TESTS=1 (see tests/bdd.rs), so
# this always-compiled dev-dep never drags a browser into the default gate.
# Its defaults minus `manager`, the driver auto-download: the tests spawn
# geckodriver themselves, and `manager` pulls in `zip` 8, whose extraction
# code has security advisories fixed only in `zip` 9.
thirtyfour = { version = "0.38", default-features = false, features = ["reqwest", "rustls", "component", "cdp"] }
# The kill-the-tree reaper of the @browser worst-case scenario: killpg of
# geckodriver's process group + a /proc orphan scan, both unix-only (the
# @browser layer runs on Linux).
libc = { workspace = true }

[[test]]
name = "bdd"
harness = false
