[package]
name = "phd2-guider"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "PHD2 guider client library and service for Rusty Photon"

[lints]
workspace = true

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
humantime = { workspace = true }
humantime-serde = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
derive_more = { workspace = true }
base64 = { workspace = true }
axum = { workspace = true }
rp-fits = { workspace = true }
rusty-photon-config = { workspace = true }
rusty-photon-doctor-checks = { workspace = true }
rusty-photon-server-config = { workspace = true }
rusty-photon-service-lifecycle = { workspace = true }
rusty-photon-tls = { workspace = true }
rp-auth = { workspace = true }
async-trait = { workspace = true }
# The opt-in ASCOM Alpaca Camera facade (docs/services/phd2-guider.md
# § "Camera facade").
ascom-alpaca = { workspace = true, features = ["server", "camera"] }
rusty-photon-camera-core = { workspace = true }
# The setup page (docs/services/phd2-guider.md § "Setup page").
rusty-photon-setup = { workspace = true }
schemars = { workspace = true }
ndarray = { workspace = true }
uuid = { workspace = true }
rusty-photon-rolling-stats = { workspace = true }
# `systemctl show` for PHD2's unit, run under a deadline (docs/services/phd2-guider.md
# § "PHD2 under the service manager").
rusty-photon-process = { workspace = true }

# Enable the Windows Service Control Manager dispatch only on Windows;
# on Unix the `scm` feature would pull in `windows-service` for no
# runtime benefit.
[target.'cfg(windows)'.dependencies]
rusty-photon-service-lifecycle = { workspace = true, features = ["scm"] }

# `O_NOFOLLOW` for opening the facade's frames without following a link.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[package.metadata.miri]
command = "cargo miri test -p phd2-guider"

[[bin]]
name = "mock_phd2"
path = "src/bin/mock_phd2.rs"

[[test]]
name = "bdd"
harness = false

[package.metadata.deb]
name = "rusty-photon-phd2-guider"
maintainer = "Igor von Nyssen <igor@vonnyssen.com>"
extended-description = "Guider service wrapping the PHD2 guiding application (HTTP API for rp), plus a command-line PHD2 client."
section = "science"
priority = "optional"
# $auto = dpkg-shlibdeps (needs a Debian build host); adduser is used by postinst.
depends = "$auto, adduser"
# The PHD2 display's X server and the tool its start script makes the X
# cookie with; only a host switched over to PHD2 under the service manager
# needs them.
recommends = "tigervnc-standalone-server, xauth"
assets = [
    ["target/release/phd2-guider", "usr/bin/rusty-photon-phd2-guider", "755"],
    # PHD2 under the service manager: off until the operator switches the
    # host over (docs/packaging.md), and left running by an upgrade, which
    # must never end PHD2 mid-guide. cargo-deb gives every unit it installs
    # into usr/lib/systemd/system the one set of systemd-units options below,
    # the guider's enable, start and restart, so these two go to
    # lib/systemd/system as plain files, out of its reach: the same
    # directory where /usr is merged, and systemd's own where it is not.
    # pkg/prerm stops them on removal.
    ["pkg/rusty-photon-phd2.service", "lib/systemd/system/rusty-photon-phd2.service", "644"],
    ["pkg/rusty-photon-phd2-display.service", "lib/systemd/system/rusty-photon-phd2-display.service", "644"],
    ["pkg/phd2-display", "usr/lib/rusty-photon/phd2-display", "755"],
]
maintainer-scripts = "pkg/"

[package.metadata.deb.systemd-units]
unit-name = "rusty-photon-phd2-guider"
unit-scripts = "pkg/"
enable = true
start = true
restart-after-upgrade = true

[package.metadata.generate-rpm]
name = "rusty-photon-phd2-guider"
summary = "Guider service wrapping the PHD2 guiding application (HTTP API for rp)"
license = "MIT OR Apache-2.0"
assets = [
    { source = "target/release/phd2-guider", dest = "/usr/bin/rusty-photon-phd2-guider", mode = "755" },
    { source = "pkg/rusty-photon-phd2-guider.service", dest = "/usr/lib/systemd/system/rusty-photon-phd2-guider.service", mode = "644" },
    { source = "pkg/rusty-photon-phd2.service", dest = "/usr/lib/systemd/system/rusty-photon-phd2.service", mode = "644" },
    { source = "pkg/rusty-photon-phd2-display.service", dest = "/usr/lib/systemd/system/rusty-photon-phd2-display.service", mode = "644" },
    { source = "pkg/phd2-display", dest = "/usr/lib/rusty-photon/phd2-display", mode = "755" },
]
# /var/lib/rusty-photon/phd2 is PHD2's home under the service manager,
# made here so the switch-over can write the VNC password into it before
# either PHD2 unit has run. Neither PHD2 unit is enabled here: the
# operator enables them when switching the host over.
post_install_script = """
getent passwd rusty-photon > /dev/null || useradd -r -d /var/lib/rusty-photon -s /sbin/nologin rusty-photon
install -d -m 0750 -o rusty-photon -g rusty-photon /var/lib/rusty-photon /var/lib/rusty-photon/.config /var/lib/rusty-photon/.config/rusty-photon /var/lib/rusty-photon/phd2
[ -e /etc/rusty-photon ] || ln -s /var/lib/rusty-photon/.config/rusty-photon /etc/rusty-photon
systemctl daemon-reload
if [ "$1" -eq 1 ]; then
    systemctl enable rusty-photon-phd2-guider.service
fi
"""
# rpm scriptlet arg $1 = package instances remaining after the operation.
# On upgrade the old %preun runs AFTER the new %post, so an unguarded
# stop/disable would take the service down right after every upgrade.
# Guarded: enable fires on first install only (upgrades keep the
# operator's enable/disable choice), stop/disable on final erase only,
# and try-restart hands a running service over to the upgraded binary
# (the deb restart-after-upgrade equivalent). The PHD2 units are stopped
# on erase only and never restarted: an upgrade leaves PHD2 running.
pre_uninstall_script = """
if [ "$1" -eq 0 ]; then
    systemctl stop rusty-photon-phd2-guider.service || true
    systemctl disable rusty-photon-phd2-guider.service || true
    systemctl stop rusty-photon-phd2.service rusty-photon-phd2-display.service || true
    systemctl disable rusty-photon-phd2.service || true
fi
"""
# rpm has no purge lifecycle: erase preserves the runtime-created config and
# state (removal is a documented manual step), matching dpkg remove-vs-purge.
post_uninstall_script = """
systemctl daemon-reload
if [ "$1" -ge 1 ]; then
    systemctl try-restart rusty-photon-phd2-guider.service || true
fi
"""
require-sh = true

# The PHD2 display's X server and xauth, as the deb recommends them. Newer
# Fedora's tigervnc-x11-server provides tigervnc-server-minimal.
[package.metadata.generate-rpm.recommends]
tigervnc-server-minimal = "*"
xorg-x11-xauth = "*"

[dev-dependencies]
tokio-test = { workspace = true }
base64 = { workspace = true }
mockall = { workspace = true }
tempfile = { workspace = true }
cargo-husky = { workspace = true }
cucumber = { workspace = true }
bdd-infra = { workspace = true, features = ["tls-auth", "setup-pages"] }
reqwest = { workspace = true }
# The camera-facade BDD steps talk to the facade as an Alpaca client.
ascom-alpaca = { workspace = true, features = ["client", "camera"] }

[target.'cfg(unix)'.dev-dependencies]
libc = { workspace = true }
