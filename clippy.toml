# Test code is allowed to panic where the panic is the point: a failed `Given`
# means the fixture is broken, and failing fast with a clear message beats
# threading a `Result` through the assertion (docs/skills/testing.md, rule 7).
#
# These four switch the corresponding lints off *in test scope only* --
# production code in the same file still gets the full deny. That is what makes
# a `#[cfg(test)] mod tests { ... }` need no `#[allow]` of its own.
#
# Clippy recognises `#[cfg(test)]` modules and `#[test]` functions. It does NOT
# recognise cucumber step definitions (`#[given]`/`#[when]`/`#[then]`), which
# are plain functions in a test crate -- those files still carry a file-level
# `#![allow(...)]`. There is no knob for `unreachable`.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true

# polar-align's `Vec3` (services/polar-align/src/math.rs) is three `f64`
# fields; its `Add`/`Sub` impls are componentwise float arithmetic, which
# cannot panic or wrap -- the same property that makes clippy exempt float
# math on primitives. The pair form deliberately blesses only the verified
# `Vec3 <op> Vec3` shape: a future mixed-type operator (`Vec3 * usize`,
# `Vec3 + f64`) still fires until it is reviewed and added here.
#
# Spelling (measured on clippy 0.1.95): the entry must equal the type's
# `Ty::to_string()`, which prints the path *without* the local crate name --
# so `math::Vec3`, not `Vec3` or `polar_align::math::Vec3`. Any crate whose
# `math` module defines a `Vec3` with operators would inherit this; today
# exactly one does. `[["*", "*"]]` can never match (the glob arm compares the
# other side literally), so a wildcard row is not a usable escape hatch.
# pa-falcon-rotator's degree newtypes (services/pa-falcon-rotator/src/
# units.rs) get the same treatment for the same reason: each impl is a
# single-`f64` operation (`self.0 <op> rhs.0`), which cannot panic or wrap.
# Only the three frame-conversion pairs the driver actually defines are
# blessed — `mech + offset = sky`, `sky - offset = mech`, `sky - mech =
# offset`; any future mixed-type operator still fires until reviewed here.
arithmetic-side-effects-allowed-binary = [
    ["math::Vec3", "math::Vec3"],
    ["units::MechanicalDegrees", "units::SyncOffset"],
    ["units::SkyDegrees", "units::SyncOffset"],
    ["units::SkyDegrees", "units::MechanicalDegrees"],
]
